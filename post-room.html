<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Room - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .preview-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; }
    .remove-image { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    .upload-btn { background-color: #22C55E; color: white; text-align: center; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; display: inline-block; }
    .upload-btn:hover { background-color: #16A34A; }
  </style>
</head>
<body class="bg-slate-900">

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3"><a href="index.html" class="flex items-center gap-2"><div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-sm">S</span></div><div><h1 class="text-xl font-bold text-white">StudentStay</h1><p class="text-xs text-slate-300">Find Rooms. No Stress.</p></div></a></div>
  </nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <h1 class="text-2xl font-bold text-white mb-2">Post a Room</h1>
      <p class="text-slate-300 text-sm mb-6">Fill out the form. Admin will review before publishing.</p>
      
      <div id="messageArea" class="hidden mb-4 p-3 rounded-lg"></div>
      
      <form id="roomForm">
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Title *</label><input type="text" id="title" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Price (FCFA/month) *</label><input type="number" id="price" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-slate-300 text-sm font-semibold mb-1">City *</label><select id="city" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"><option value="Bambili">Bambili</option><option value="Bamenda">Bamenda</option><option value="Mankon">Mankon</option><option value="Up Station">Up Station</option><option value="Nkwen">Nkwen</option></select></div><div><label class="block text-slate-300 text-sm font-semibold mb-1">Area</label><input type="text" id="area" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Distance (km) *</label><input type="number" id="distance" step="0.1" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Description *</label><textarea id="description" rows="4" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></textarea></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Features (comma separated)</label><input type="text" id="features" placeholder="Water, Electricity, Furnished" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">WhatsApp Number *</label><input type="tel" id="phone" required placeholder="670922913" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        
        <!-- Image Upload - Solid Green Custom Button -->
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1">Upload Images (max 5)</label>
          <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
          <button type="button" id="uploadBtn" class="upload-btn">📸 Choose Images (max 5)</button>
          <p class="text-slate-500 text-xs mt-1">Select up to 5 images (JPG, PNG). Uploaded to ImgBB (free).</p>
          <div id="previewContainer" class="flex flex-wrap gap-2 mt-3"></div>
        </div>
        
        <button type="submit" id="submitBtn" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-green-600 transition">Submit Listing</button>
      </form>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = '4d01c952d0e4fd8cd5cc6d81ef0fd025';
    let selectedFiles = [];
    let isUploading = false;
    
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const previewContainer = document.getElementById('previewContainer');
    
    // Trigger file input when button is clicked
    uploadBtn.addEventListener('click', () => {
      imageInput.click();
    });
    
    imageInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (selectedFiles.length + files.length > 5) { alert('Max 5 images'); imageInput.value = ''; return; }
      files.forEach(file => {
        if (file.size > 32 * 1024 * 1024) { alert(`${file.name} > 32MB`); return; }
        selectedFiles.push(file);
        const reader = new FileReader();
        reader.onload = (event) => {
          const div = document.createElement('div'); div.className = 'relative inline-block';
          div.innerHTML = `<img src="${event.target.result}" class="preview-image"><div class="remove-image" onclick="this.parentElement.remove(); removeImage('${file.name}')">×</div>`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
      imageInput.value = '';
    });
    
    function removeImage(fileName) { selectedFiles = selectedFiles.filter(f => f.name !== fileName); }
    
    async function uploadToImgBB(file) {
      const fd = new FormData(); fd.append('key', IMGBB_API_KEY); fd.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (!data.success) throw new Error('Upload failed');
      return data.data.url;
    }
    
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const userDoc = await db.collection('users').doc(user.uid).get();
      const userData = userDoc.data();
      if (userData.role !== 'landlord' && userData.role !== 'admin') {
        alert('Only approved landlords can post rooms.');
        window.location.href = 'dashboard.html';
      }
    });
    
    document.getElementById('roomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isUploading) return;
      const user = firebase.auth().currentUser;
      const title = document.getElementById('title').value, price = parseInt(document.getElementById('price').value), city = document.getElementById('city').value, area = document.getElementById('area').value, distance = parseFloat(document.getElementById('distance').value), description = document.getElementById('description').value, features = document.getElementById('features').value.split(',').map(f=>f.trim()), phone = document.getElementById('phone').value;
      const msgDiv = document.getElementById('messageArea');
      msgDiv.classList.remove('hidden'); msgDiv.className = 'mb-4 p-3 rounded-lg bg-blue-500/20 text-blue-400';
      msgDiv.innerHTML = '📤 Uploading images...';
      isUploading = true; const submitBtn = document.getElementById('submitBtn'); submitBtn.disabled = true; submitBtn.textContent = 'Uploading...';
      try {
        const imageUrls = await Promise.all(selectedFiles.map(file => uploadToImgBB(file)));
        await db.collection('rooms').add({ title, price, city, area: area || null, distance, description, features, phone, images: imageUrls, landlordId: user.uid, status: 'pending', createdAt: new Date(), expiresAt: new Date(Date.now() + 30*24*60*60*1000) });
        const userDoc = await db.collection('users').doc(user.uid).get();
        const currentFree = userDoc.data().freeListingsRemaining || 5;
        await db.collection('users').doc(user.uid).update({ freeListingsRemaining: currentFree - 1 });
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-green-500/20 text-green-400';
        msgDiv.innerHTML = '✅ Room posted! Redirecting...';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
      } catch (error) {
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-red-500/20 text-red-400';
        msgDiv.innerHTML = '❌ Error: ' + error.message;
        submitBtn.disabled = false; submitBtn.textContent = 'Submit Listing';
        isUploading = false;
      }
    });
  </script>
</body>
</html>
