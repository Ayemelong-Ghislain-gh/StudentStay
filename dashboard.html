<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }
    .nav-btn {
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
      font-weight: 500;
    }
    .nav-btn:hover {
      background-color: #22C55E;
      color: white !important;
    }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .btn-primary { background-color: #22C55E; color: white; }
    body.light-mode .btn-primary:hover { background-color: #16A34A; }
    body.light-mode .bg-primary { background-color: #22C55E; }
    body.light-mode .text-primary { color: #22C55E; }

    /* Dashboard specific light mode */
    body.light-mode h2.text-white,
    body.light-mode .text-slate-400,
    body.light-mode .text-slate-300 {
      color: #111827 !important;
    }
    body.light-mode .bg-slate-700\/50 {
      background-color: #F3F4F6 !important;
    }
    body.light-mode .bg-yellow-500\/20 {
      background-color: #FEF3C7 !important;
    }
    body.light-mode .bg-green-500\/20 {
      background-color: #D1FAE5 !important;
    }
    body.light-mode .bg-slate-700 {
      background-color: #FFFFFF !important;
      border: 1px solid #E5E7EB !important;
    }

    /* Navbar stays dark with white text in both modes */
    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav p,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }
    body.light-mode #mobileMenu {
      background-color: #1E293B !important;
    }
    body.light-mode #mobileMenu a,
    body.light-mode #mobileMenu button {
      color: #FFFFFF !important;
    }
    <style>
    /* Language Selection Modal */
    .lang-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: all 0.3s ease;
    }
    .lang-modal {
        background: #1E293B;
        border-radius: 24px;
        padding: 32px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        border: 1px solid #334155;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: modalFadeIn 0.3s ease;
    }
    body.light-mode .lang-modal {
        background: #FFFFFF;
        border-color: #E5E7EB;
    }
    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    .lang-flag {
        font-size: 48px;
        margin-bottom: 16px;
    }
    .lang-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
    }
    .lang-subtitle {
        font-size: 14px;
        color: #94A3B8;
        margin-bottom: 24px;
    }
    .lang-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .lang-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px 24px;
        background: #334155;
        border: 2px solid #475569;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 120px;
    }
    .lang-btn:hover {
        transform: translateY(-2px);
        border-color: #22C55E;
        background: #22C55E20;
    }
    .lang-btn-flag {
        font-size: 32px;
    }
    .lang-btn-text {
        font-size: 18px;
        font-weight: 600;
    }
    .lang-btn-sub {
        font-size: 12px;
        color: #94A3B8;
    }
    body.light-mode .lang-btn {
        background: #F3F4F6;
        border-color: #E5E7EB;
    }
    body.light-mode .lang-btn:hover {
        background: #22C55E10;
        border-color: #22C55E;
    }
    .hidden-modal {
        display: none !important;
    }
</style>
  </style>
</head>
<body>
  <!-- Language Selection Modal -->
  <div id="languageModal" class="lang-modal-overlay">
      <div class="lang-modal">
          <div class="lang-flag">🇨🇲</div>
          <h2 class="lang-title">Welcome to StudentStay</h2>
          <p class="lang-subtitle">Bienvenue sur StudentStay</p>
          <div class="lang-buttons">
              <div class="lang-btn" onclick="selectLanguage('en')">
                  <div class="lang-btn-flag">🇬🇧</div>
                  <div class="lang-btn-text">English</div>
                  <div class="lang-btn-sub">Continue in English</div>
              </div>
              <div class="lang-btn" onclick="selectLanguage('fr')">
                  <div class="lang-btn-flag">🇫🇷</div>
                  <div class="lang-btn-text">Français</div>
                  <div class="lang-btn-sub">Continuer en français</div>
              </div>
          </div>
      </div>
  </div>
  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">StudentStay</h1>
          <p class="text-xs text-slate-300">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary">Home</a>
        <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary">Browse</a>
        <a href="dashboard.html" class="nav-btn text-primary hover:text-primary">Dashboard</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary">🌓 Dark/Light</button>
        <a href="#" id="logoutBtn" class="nav-btn text-slate-300 hover:text-primary">Logout</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left">Home</a>
      <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary block text-left">Browse</a>
      <a href="dashboard.html" class="nav-btn text-primary hover:text-primary block text-left">Dashboard</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌓 Dark/Light</button>
      <a href="#" id="mobileLogoutBtn" class="nav-btn text-slate-300 hover:text-primary block text-left">Logout</a>
      <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🇫🇷 FR</button>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="dashboardContent" class="bg-slate-800 rounded-xl border border-slate-700 p-6"><div class="text-center py-10 text-slate-400">Loading...</div></div>
  </div>

  <script>
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });
    document.getElementById('mobileDarkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    window.deleteRoom = async (roomId) => {
      if (confirm('Delete this room permanently? This action cannot be undone.')) {
        await db.collection('rooms').doc(roomId).delete();
        window.location.reload();
      }
    };

    document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const userDoc = await db.collection('users').doc(user.uid).get();
      const userData = userDoc.data() || { fullName: user.email, role: 'user', freeListingsRemaining: 5 };
      const applications = await db.collection('applications').where('userId', '==', user.uid).where('status', '==', 'pending').get();
      const hasPending = !applications.empty;
      const isLandlord = userData.role === 'landlord' || userData.role === 'admin';
      const roomsSnapshot = await db.collection('rooms').where('landlordId', '==', user.uid).get();
      
      let landlordSection = '';
      if (!isLandlord && !hasPending && userData.role !== 'admin') landlordSection = `<div class="bg-slate-700/50 rounded-lg p-4 mb-6"><p class="text-white font-semibold mb-2">Want to list rooms?</p><button id="becomeLandlordBtn" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold">Request to become Landlord</button></div>`;
      else if (hasPending) landlordSection = `<div class="bg-yellow-500/20 border border-yellow-500/30 rounded-lg p-4 mb-6"><p class="text-yellow-400 font-semibold">⏳ Pending Approval</p><p class="text-yellow-300 text-sm">Your landlord application is being reviewed.</p></div>`;
      else if (isLandlord) landlordSection = `<div class="bg-green-500/20 border border-green-500/30 rounded-lg p-4 mb-6"><p class="text-green-400 font-semibold">✅ Verified Landlord</p><p class="text-green-300 text-sm">You have ${userData.freeListingsRemaining || 5} free listings remaining.</p><a href="post-room.html" class="inline-block mt-3 bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Post New Room</a></div>`;
      
      let myRoomsHtml = '<div class="space-y-3">';
      roomsSnapshot.forEach(doc => { const room = doc.data(); myRoomsHtml += `<div class="bg-slate-700 rounded-lg p-3 flex justify-between items-center flex-wrap gap-2"><div><h4 class="text-white font-semibold">${room.title}</h4><p class="text-slate-400 text-sm">${room.price.toLocaleString()} FCFA/mo • ${room.city}</p><span class="text-xs px-2 py-0.5 rounded ${room.status === 'approved' ? 'bg-green-500/20 text-green-400' : room.status === 'pending' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-red-500/20 text-red-400'}">${room.status}</span></div><div class="flex gap-2"><a href="edit-room.html?id=${doc.id}" class="bg-yellow-600 text-white px-3 py-1 rounded text-sm hover:bg-yellow-700">Edit</a><button onclick="deleteRoom('${doc.id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Delete</button><a href="details.html?id=${doc.id}" class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-green-600">View</a></div></div>`; });
      myRoomsHtml += roomsSnapshot.empty ? '<p class="text-slate-400 text-sm">No rooms posted yet.</p>' : '</div>';
      
      document.getElementById('dashboardContent').innerHTML = `<div><div class="flex justify-between items-start mb-6"><div><h2 class="text-2xl font-bold text-white">Welcome, ${userData.fullName || user.email}!</h2><p class="text-slate-400 text-sm">${user.email}</p><p class="text-slate-400 text-sm">Role: <span class="text-primary">${userData.role || 'user'}</span></p></div></div>${landlordSection}<div class="border-t border-slate-700 pt-4"><h3 class="font-semibold text-white mb-3">My Rooms</h3>${myRoomsHtml}</div></div>`;
      
      const becomeBtn = document.getElementById('becomeLandlordBtn');
      if (becomeBtn) becomeBtn.onclick = async () => { await db.collection('applications').add({ userId: user.uid, userEmail: user.email, requestedRole: 'landlord', status: 'pending', createdAt: new Date() }); alert('Application submitted!'); window.location.reload(); };
      
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (mobileLogout) {
        mobileLogout.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'index.html'; };
      }
    });
    
    document.getElementById('logoutBtn').onclick = () => { firebase.auth().signOut(); window.location.href = 'index.html'; };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
</body>
</html>
