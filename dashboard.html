<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/shared.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .btn-primary { background-color: #22C55E; color: white; }
    body.light-mode .btn-primary:hover { background-color: #16A34A; }
    body.light-mode .bg-primary { background-color: #22C55E; }
    body.light-mode .text-primary { color: #22C55E; }

    /* Dashboard specific light mode */
    body.light-mode h2.text-white,
    body.light-mode .text-slate-400,
    body.light-mode .text-slate-300 {
      color: #111827 !important;
    }
    body.light-mode .bg-slate-700\/50 {
      background-color: #F3F4F6 !important;
    }
    body.light-mode .bg-yellow-500\/20 {
      background-color: #FEF3C7 !important;
    }
    body.light-mode .bg-green-500\/20 {
      background-color: #D1FAE5 !important;
    }
    body.light-mode .bg-slate-700 {
      background-color: #FFFFFF !important;
      border: 1px solid #E5E7EB !important;
    }

    /* Navbar stays dark with white text in both modes */

  </style>
</head>
<body data-feedback-auth="required">

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="appName">StudentStay</h1>
          <p class="text-xs text-slate-300" data-i18n="tagline">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="browse">Browse</a>
        <a href="dashboard.html" class="nav-btn text-primary hover:text-primary" data-i18n="dashboard">Dashboard</a>
        <a href="admin.html" id="adminNavLink" style="display:none;" class="nav-btn text-slate-300 hover:text-primary" data-i18n="admin">Admin</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
        <a href="#" id="logoutBtn" class="nav-btn text-slate-300 hover:text-primary" data-i18n="logout">Logout</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left" data-i18n="home">Home</a>
      <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="browse">Browse</a>
      <a href="dashboard.html" class="nav-btn text-primary hover:text-primary block text-left" data-i18n="dashboard">Dashboard</a>
      <a href="admin.html" id="mobileAdminNavLink" style="display:none;" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="admin">Admin</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full" data-i18n="darkLight">🌓 Dark/Light</button>
      <button id="mobileLanguageToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌐 FR/EN</button>
      <a href="#" id="mobileLogoutBtn" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="logout">Logout</a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="dashboardBanner" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 text-red-400"></div>
    <div id="dashboardContent" class="bg-slate-800 rounded-xl border border-slate-700 p-6"><div class="text-center py-10 text-slate-400" data-i18n="loadingText">Loading...</div></div>
  </div>

  <!-- Request Landlord Status Modal -->
  <div id="landlordAppModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[9998] p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full">
      <h3 class="text-white font-semibold text-lg mb-2" data-i18n="requestLandlord">Request Landlord Status</h3>
      <p class="text-slate-400 text-sm mb-4" data-i18n="landlordAppInfo">An admin will review your request. Once approved, you'll be marked as a verified landlord.</p>
      <p id="landlordAppMsg" class="hidden text-red-400 text-sm mb-3"></p>
      <div class="flex gap-2 justify-end">
        <button type="button" onclick="closeLandlordModal()" class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700" data-i18n="cancel">Cancel</button>
        <button type="button" id="landlordAppSubmitBtn" onclick="submitLandlordApplication()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="submitApplication">Submit Request</button>
      </div>
    </div>
  </div>

  <script>
    // Language Toggle Buttons
    const langToggle = document.getElementById('languageToggle');
    const mobileLangToggle = document.getElementById('mobileLanguageToggle');
    
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        loadDashboardData();
      });
    }
    if (mobileLangToggle) {
      mobileLangToggle.addEventListener('click', () => {
        toggleLanguage();
        loadDashboardData();
      });
    }

    window.deleteRoom = async (roomId, btn) => {
      if (confirm(t('confirm') + '? ' + t('deleteRoom'))) {
        setButtonLoading(btn, true, t('deleting') || 'Deleting...');
        const { error } = await sb.rpc('delete_room', { room_id: roomId });
        if (error) { alert(error.message); setButtonLoading(btn, false); return; }
        window.location.reload();
      }
    };

    async function loadDashboardData() {
      const user = currentUser;
      if (!user) { window.location.href = 'login.html'; return; }
      
      const { data: profileRow } = await sb.from('profiles').select('*').eq('id', user.id).single();
      const userData = profileRow
        ? { fullName: profileRow.full_name, role: profileRow.role, freeListingsRemaining: profileRow.free_listings_remaining }
        : { fullName: user.email, role: 'user', freeListingsRemaining: 5 };
      
      if (userData.role === 'admin') {
        const adminLink = document.getElementById('adminNavLink');
        const mobileAdminLink = document.getElementById('mobileAdminNavLink');
        if (adminLink) adminLink.style.display = '';
        if (mobileAdminLink) mobileAdminLink.style.display = '';
      }
      const { data: roomRows } = await sb.from('rooms').select('*').eq('landlord_id', user.id);
      const roomsSnapshot = { docs: (roomRows || []).map(r => ({ id: r.id, data: () => ({
        title: r.title, city: r.city, status: r.status, pricingType: r.pricing_type,
        monthlyPrice: r.monthly_price, yearlyPrice: r.yearly_price, price: r.price,
        postedAs: r.posted_as, expiresAt: r.expires_at
      }) })), empty: (roomRows || []).length === 0 };
      
      // Anyone can post — no role gate anymore. Just show remaining free listings.
      const postingSection = `<div class="bg-green-500/20 border border-green-500/30 rounded-lg p-4 mb-6">
        <p class="text-green-300 text-sm" data-i18n="freeListings">You have ${userData.freeListingsRemaining ?? 5} <span data-i18n="freeListingsRemaining">free listings remaining.</span></p>
        <a href="post-room.html" class="inline-block mt-3 bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="postNewRoom">+ Post New Room</a>
      </div>`;

      // Landlord application section — hidden once the user is already a
      // landlord/admin, and swapped for a status message while a request
      // is pending review.
      let landlordSection = '';
      if (userData.role !== 'landlord' && userData.role !== 'admin') {
        const { data: existingApps } = await sb.from('applications')
          .select('id, status')
          .eq('user_id', user.id)
          .eq('requested_role', 'landlord')
          .order('created_at', { ascending: false })
          .limit(1);
        const latestApp = (existingApps && existingApps[0]) || null;
        if (latestApp && latestApp.status === 'pending') {
          landlordSection = `<div class="bg-yellow-500/20 border border-yellow-500/30 rounded-lg p-4 mb-6">
            <p class="text-yellow-300 text-sm" data-i18n="landlordAppPending">Your landlord request is pending admin review.</p>
          </div>`;
        } else {
          landlordSection = `<div class="bg-slate-700/50 border border-slate-600 rounded-lg p-4 mb-6 flex justify-between items-center flex-wrap gap-3">
            <p class="text-slate-300 text-sm" data-i18n="landlordAppPrompt">Want to list rooms as a verified landlord?</p>
            <button onclick="openLandlordModal()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold" data-i18n="requestLandlord">Request Landlord Status</button>
          </div>`;
        }
      }
      
      let myRoomsHtml = '<div class="space-y-3"><h3 class="font-semibold text-white mb-3" data-i18n="myRooms">My Rooms</h3>';
      const now = Date.now();
      for (const doc of roomsSnapshot.docs) { 
        const room = doc.data(); 
        const pricingType = room.pricingType || 'monthly';
        let priceDisplay = '';
        if (pricingType === 'yearly') {
          priceDisplay = `${(room.yearlyPrice || room.price || 0).toLocaleString()} FCFA/${t('perYear')}`;
        } else if (pricingType === 'both') {
          priceDisplay = `${(room.monthlyPrice || room.price || 0).toLocaleString()} FCFA/${t('perMonth')} • ${(room.yearlyPrice || (room.monthlyPrice * 9) || 0).toLocaleString()} FCFA/${t('perYear')}`;
        } else {
          priceDisplay = `${(room.monthlyPrice || room.price || 0).toLocaleString()} FCFA/${t('perMonth')}`;
        }
        
        const expiresAtMs = room.expiresAt ? new Date(room.expiresAt).getTime() : null;
        const daysLeft = expiresAtMs ? Math.ceil((expiresAtMs - now) / (24*60*60*1000)) : null;
        const isExpired = daysLeft !== null && daysLeft <= 0;
        const expiringSoon = daysLeft !== null && daysLeft > 0 && daysLeft <= 5;
        let expiryBadge = '';
        if (room.status === 'approved' && daysLeft !== null) {
          expiryBadge = isExpired
            ? `<span class="text-xs px-2 py-0.5 rounded bg-red-500/20 text-red-400 ml-1" data-i18n="expired">Expired</span>`
            : expiringSoon
              ? `<span class="text-xs px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-400 ml-1">${daysLeft}d left</span>`
              : `<span class="text-xs px-2 py-0.5 rounded bg-slate-600 text-slate-300 ml-1">${daysLeft}d left</span>`;
        }
        
        myRoomsHtml += `<div class="bg-slate-700 rounded-lg p-3 flex justify-between items-center flex-wrap gap-2">
          <div>
            <h4 class="text-white font-semibold">${escapeHtml(room.title)} <span class="text-xs text-slate-400 capitalize">(${room.postedAs || 'owner'})</span></h4>
            <p class="text-slate-400 text-sm">${priceDisplay} • ${escapeHtml(room.city)}</p>
            <span class="text-xs px-2 py-0.5 rounded ${room.status === 'approved' ? 'bg-green-500/20 text-green-400' : room.status === 'pending' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-red-500/20 text-red-400'}">${room.status}</span>${expiryBadge}
          </div>
          <div class="flex gap-2">
            ${room.status === 'approved' ? `<button onclick="renewRoom('${doc.id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700" data-i18n="renew">Renew</button>` : ''}
            <a href="edit-room.html?id=${doc.id}" class="bg-yellow-600 text-white px-3 py-1 rounded text-sm hover:bg-yellow-700" data-i18n="edit">Edit</a>
            <button onclick="deleteRoom('${doc.id}', this)" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700" data-i18n="delete">Delete</button>
            <a href="details.html?id=${doc.id}" class="bg-primary text-white px-3 py-1 rounded text-sm hover:bg-green-600" data-i18n="viewDetails">View</a>
          </div>
        </div>`;
      }
      myRoomsHtml += roomsSnapshot.empty ? `<p class="text-slate-400 text-sm" data-i18n="noRoomsYet">No rooms posted yet.</p>` : '</div>';
      
      const dashboardHtml = `<div>
        <div class="flex justify-between items-start mb-6">
          <div>
            <h2 class="text-2xl font-bold text-white" data-i18n="welcome">Welcome</h2>
            <p class="text-slate-400 text-sm">${escapeHtml(userData.fullName || user.email)}!</p>
            <p class="text-slate-400 text-sm">${user.email}</p>
            <p class="text-slate-400 text-sm" data-i18n="role">Role: <span class="text-primary">${userData.role || 'user'}</span></p>
          </div>
        </div>
        ${postingSection}
        ${landlordSection}
        <div class="border-t border-slate-700 pt-4">
          ${myRoomsHtml}
        </div>
      </div>`;
      
      document.getElementById('dashboardContent').innerHTML = dashboardHtml;
      
      // Re-apply translations to dynamic content
      updatePageLanguage();
    }
    
    window.renewRoom = async (roomId) => {
      const { error } = await sb.rpc('renew_room', { room_id: roomId });
      if (error) { alert(error.message); return; }
      loadDashboardData();
    };

    // --- Landlord application flow -------------------------------------
    window.openLandlordModal = () => {
      const msgEl = document.getElementById('landlordAppMsg');
      msgEl.classList.add('hidden'); msgEl.textContent = '';
      document.getElementById('landlordAppModal').classList.remove('hidden');
    };
    window.closeLandlordModal = () => {
      document.getElementById('landlordAppModal').classList.add('hidden');
    };
    window.submitLandlordApplication = async () => {
      if (!currentUser) { window.location.href = 'login.html'; return; }
      const btn = document.getElementById('landlordAppSubmitBtn');
      const msgEl = document.getElementById('landlordAppMsg');
      btn.disabled = true; btn.textContent = t('submitting') || 'Submitting...';
      const { error } = await sb.from('applications').insert({
        user_id: currentUser.id,
        user_email: currentUser.email,
        requested_role: 'landlord',
        status: 'pending'
      });
      btn.disabled = false; btn.textContent = t('submitApplication') || 'Submit Request';
      if (error) {
        msgEl.textContent = error.message;
        msgEl.classList.remove('hidden');
        return;
      }
      closeLandlordModal();
      loadDashboardData();
    };
    
    
    // Listen for language changes
    window.addEventListener('languageChanged', () => {
      loadDashboardData();
    });
    
    (async () => {
      const { data } = await sb.auth.getSession();
      const user = data.session?.user ?? null;
      if (!user) { 
        window.location.href = 'login.html'; 
        return; 
      }
      currentUser = user;
      loadDashboardData();

      const bannerMsg = sessionStorage.getItem('dashboardError');
      if (bannerMsg) {
        sessionStorage.removeItem('dashboardError');
        const banner = document.getElementById('dashboardBanner');
        if (banner) { banner.textContent = bannerMsg; banner.classList.remove('hidden'); }
      }
      
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (mobileLogout) {
        mobileLogout.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'index.html'); };
      }
    })();
    
    document.getElementById('logoutBtn').onclick = () => { sb.auth.signOut().then(() => window.location.href = 'index.html'); };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
<p class="text-center text-xs text-slate-600 py-4"><a href="https://asghinlabs.vercel.app" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: none; font-weight: 500;">a asghinlabs product</a></p>

</body>
</html>
