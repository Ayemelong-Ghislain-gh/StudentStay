<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }

    /* Navbar stays dark with white text in both modes */
    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav p,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }
    body.light-mode #mobileMenu {
      background-color: #1E293B !important;
    }
    body.light-mode #mobileMenu a,
    body.light-mode #mobileMenu button {
      color: #FFFFFF !important;
    }
  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2"><div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-sm">S</span></div><div><h1 class="text-xl font-bold text-white">StudentStay</h1><p class="text-xs text-slate-300">Find Rooms. No Stress.</p></div></a>
      <!-- DESKTOP MENU -->
      <div class="hidden md:flex gap-4">
        <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
        <a href="listings.html" class="text-slate-300 hover:text-primary text-sm">Browse</a>
        <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">Dashboard</a>
        <button id="installAppBtn" style="display:none; background:#22C55E; color:white; border:none; padding:4px 12px; border-radius:8px;">📲 Install</button>
        <button id="darkModeToggle" class="text-slate-300 hover:text-primary text-sm">🌓 Dark/Light</button>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <!-- MOBILE MENU -->
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-3">
      <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
      <a href="listings.html" class="text-slate-300 hover:text-primary text-sm">Browse</a>
      <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">Dashboard</a>
      <button id="mobileInstallAppBtn" style="display:none; background:#22C55E; color:white; border:none; padding:8px 16px; border-radius:8px;">📲 Install App</button>
      <button id="mobileDarkModeToggle" class="text-slate-300 hover:text-primary text-sm text-left">🌓 Dark/Light</button>
    </div>
  </nav>

  <div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <div class="flex border-b border-slate-700 mb-6">
        <button id="loginTab" class="flex-1 py-2 text-center font-medium border-b-2 border-primary text-primary">Login</button>
        <button id="signupTab" class="flex-1 py-2 text-center font-medium text-slate-400">Sign Up</button>
      </div>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3">
        <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-4">
        <button id="doLogin" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-green-600">Login</button>
      </div>
      <div id="signupForm" class="hidden">
        <input type="text" id="signupName" placeholder="Full Name" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3">
        <input type="email" id="signupEmail" placeholder="Email" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3">
        <input type="tel" id="signupPhone" placeholder="WhatsApp (e.g., 670922913)" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3">
        <input type="password" id="signupPassword" placeholder="Password" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-4">
        <button id="doSignup" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-green-600">Create Account</button>
      </div>
      <div id="message" class="mt-4 text-center text-sm hidden"></div>
    </div>
  </div>

  <script>
    // Dark Mode Toggle
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });
    document.getElementById('mobileDarkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    // Mobile menu toggle
    document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));

    const loginForm = document.getElementById('loginForm'), signupForm = document.getElementById('signupForm'), loginTab = document.getElementById('loginTab'), signupTab = document.getElementById('signupTab'), msgDiv = document.getElementById('message');
    loginTab.onclick = () => { loginTab.classList.add('border-b-2','border-primary','text-primary'); signupTab.classList.remove('border-b-2','border-primary','text-primary'); signupTab.classList.add('text-slate-400'); loginForm.classList.remove('hidden'); signupForm.classList.add('hidden'); msgDiv.classList.add('hidden'); };
    signupTab.onclick = () => { signupTab.classList.add('border-b-2','border-primary','text-primary'); loginTab.classList.remove('border-b-2','border-primary','text-primary'); loginTab.classList.add('text-slate-400'); signupForm.classList.remove('hidden'); loginForm.classList.add('hidden'); msgDiv.classList.add('hidden'); };
    document.getElementById('doLogin').onclick = async () => { try { await firebase.auth().signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-green-500/20 text-green-400'; msgDiv.textContent = 'Login successful! Redirecting...'; setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000); } catch (error) { msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; msgDiv.textContent = error.message; msgDiv.classList.remove('hidden'); } };
    document.getElementById('doSignup').onclick = async () => {
      const name = document.getElementById('signupName').value, email = document.getElementById('signupEmail').value, phone = document.getElementById('signupPhone').value, password = document.getElementById('signupPassword').value;
      const phoneRegex = /^[236][0-9]{8}$/;
      if (!phoneRegex.test(phone)) { msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; msgDiv.textContent = 'Please enter a valid Cameroon phone number (9 digits, starts with 2, 3, or 6)'; msgDiv.classList.remove('hidden'); return; }
      try {
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(userCredential.user.uid).set({ fullName: name, email: email, phone: phone, role: 'user', freeListingsRemaining: 5, createdAt: new Date() });
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-green-500/20 text-green-400'; msgDiv.textContent = 'Account created! Redirecting...'; setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
      } catch (error) { msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; msgDiv.textContent = error.message; msgDiv.classList.remove('hidden'); }
    };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>

  <!-- PWA Install Script -->
  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const desktopBtn = document.getElementById('installAppBtn');
      const mobileBtn = document.getElementById('mobileInstallAppBtn');
      if (desktopBtn) desktopBtn.style.display = 'inline-block';
      if (mobileBtn) mobileBtn.style.display = 'inline-block';
    });

    function handleInstall(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.addEventListener('click', () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
              if (choice.outcome === 'accepted') console.log('User installed PWA');
              deferredPrompt = null;
              const desktopBtn = document.getElementById('installAppBtn');
              const mobileBtn = document.getElementById('mobileInstallAppBtn');
              if (desktopBtn) desktopBtn.style.display = 'none';
              if (mobileBtn) mobileBtn.style.display = 'none';
            });
          }
        });
      }
    }
    handleInstall('installAppBtn');
    handleInstall('mobileInstallAppBtn');
  </script>
</body>
</html>
