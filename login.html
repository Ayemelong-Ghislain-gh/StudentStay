<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/phone-validation.js"></script>
  <script src="js/shared.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }

    /* Navbar stays dark with white text in both modes */

  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="appName">StudentStay</h1>
          <p class="text-xs text-slate-300" data-i18n="tagline">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="browse">Browse</a>
        <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="dashboard">Dashboard</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left" data-i18n="home">Home</a>
      <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="browse">Browse</a>
      <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="dashboard">Dashboard</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full" data-i18n="darkLight">🌓 Dark/Light</button>
      <button id="mobileLanguageToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌐 FR/EN</button>
    </div>
  </nav>

  <div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <div class="flex border-b border-slate-700 mb-6">
        <button id="loginTab" class="flex-1 py-2 text-center font-medium border-b-2 border-primary text-primary" data-i18n="loginTitle">Login</button>
        <button id="signupTab" class="flex-1 py-2 text-center font-medium text-slate-400" data-i18n="signupTitle">Sign Up</button>
      </div>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3" data-i18n-placeholder="emailLabel">
        <input type="password" id="loginPassword" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-4" data-i18n-placeholder="passwordLabel">
        <button id="doLogin" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-green-600" data-i18n="login">Login</button>
      </div>
      <div id="signupForm" class="hidden">
        <input type="text" id="signupName" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3" data-i18n-placeholder="fullNameLabel">
        <input type="email" id="signupEmail" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3" data-i18n-placeholder="emailLabel">
        <input type="tel" id="signupPhone" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-3" data-i18n-placeholder="phoneLabel">
        <input type="password" id="signupPassword" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 mb-4" data-i18n-placeholder="passwordLabel">
        <button id="doSignup" class="w-full bg-primary text-white py-2 rounded-lg font-semibold hover:bg-green-600" data-i18n="createAccount">Create Account</button>
      </div>
      <div id="message" class="mt-4 text-center text-sm hidden"></div>
    </div>
  </div>

  <script>
    // Language Toggle Buttons
    const langToggle = document.getElementById('languageToggle');
    const mobileLangToggle = document.getElementById('mobileLanguageToggle');
    
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        updatePageLanguage();
        // Update tab button texts
        document.getElementById('loginTab').textContent = t('loginTitle');
        document.getElementById('signupTab').textContent = t('signupTitle');
        document.getElementById('doLogin').textContent = t('login');
        document.getElementById('doSignup').textContent = t('createAccount');
      });
    }
    if (mobileLangToggle) {
      mobileLangToggle.addEventListener('click', () => {
        toggleLanguage();
        updatePageLanguage();
        document.getElementById('loginTab').textContent = t('loginTitle');
        document.getElementById('signupTab').textContent = t('signupTitle');
        document.getElementById('doLogin').textContent = t('login');
        document.getElementById('doSignup').textContent = t('createAccount');
      });
    }

    // Listen for language changes
    window.addEventListener('languageChanged', () => {
      document.getElementById('loginTab').textContent = t('loginTitle');
      document.getElementById('signupTab').textContent = t('signupTitle');
      document.getElementById('doLogin').textContent = t('login');
      document.getElementById('doSignup').textContent = t('createAccount');
      // Update placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
      });
    });

    const loginForm = document.getElementById('loginForm'), signupForm = document.getElementById('signupForm'), loginTab = document.getElementById('loginTab'), signupTab = document.getElementById('signupTab'), msgDiv = document.getElementById('message');
    
    loginTab.onclick = () => { 
      loginTab.classList.add('border-b-2','border-primary','text-primary'); 
      signupTab.classList.remove('border-b-2','border-primary','text-primary'); 
      signupTab.classList.add('text-slate-400'); 
      loginForm.classList.remove('hidden'); 
      signupForm.classList.add('hidden'); 
      msgDiv.classList.add('hidden'); 
    };
    
    signupTab.onclick = () => { 
      signupTab.classList.add('border-b-2','border-primary','text-primary'); 
      loginTab.classList.remove('border-b-2','border-primary','text-primary'); 
      loginTab.classList.add('text-slate-400'); 
      signupForm.classList.remove('hidden'); 
      loginForm.classList.add('hidden'); 
      msgDiv.classList.add('hidden'); 
    };
    
    document.getElementById('doLogin').onclick = async () => { 
      const btn = document.getElementById('doLogin');
      setButtonLoading(btn, true, t('loggingIn') || 'Logging in...');
      try { 
        const { error } = await sb.auth.signInWithPassword({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        });
        if (error) throw error;
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-green-500/20 text-green-400'; 
        msgDiv.textContent = t('loginSuccess'); 
        msgDiv.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000); 
      } catch (error) { 
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; 
        msgDiv.textContent = error.message; 
        msgDiv.classList.remove('hidden'); 
        setButtonLoading(btn, false);
      } 
    };
    
    document.getElementById('doSignup').onclick = async () => {
      const btn = document.getElementById('doSignup');
      const name = document.getElementById('signupName').value, 
            email = document.getElementById('signupEmail').value, 
            phone = document.getElementById('signupPhone').value, 
            password = document.getElementById('signupPassword').value;
      const phoneCheck = validateCameroonPhone(phone);
      if (!phoneCheck.isValid) { 
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; 
        msgDiv.textContent = t('invalidPhone'); 
        msgDiv.classList.remove('hidden'); 
        return; 
      }
      setButtonLoading(btn, true, t('creatingAccount') || 'Creating account...');
      try {
        // full_name/phone travel in via options.data — a database trigger
        // (see supabase_schema.sql) reads these and creates the profile row
        // automatically. We never insert into profiles directly from the
        // client, which is what stops anyone from setting their own role.
        const { error } = await sb.auth.signUp({
          email, password,
          options: { data: { full_name: name, phone: phoneCheck.normalized } }
        });
        if (error) throw error;
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-green-500/20 text-green-400'; 
        msgDiv.textContent = t('accountCreated'); 
        msgDiv.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
      } catch (error) { 
        msgDiv.className = 'mt-4 text-center text-sm p-2 rounded bg-red-500/20 text-red-400'; 
        msgDiv.textContent = error.message; 
        msgDiv.classList.remove('hidden'); 
        setButtonLoading(btn, false);
      }
    };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
<p class="text-center text-xs text-slate-600 py-4"><a href="https://asghinlabs.vercel.app" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: none; font-weight: 500;">a asghinlabs product</a></p>

</body>
</html>
