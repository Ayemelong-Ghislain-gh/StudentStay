<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel Test</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0F172A; color: #F1F5F9; padding: 24px; }
  #log { background: #1E293B; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 16px; font-size: 14px; }
  #log div { padding: 2px 0; }

  .carousel-wrap { position: relative; width: 100%; max-width: 500px; height: 320px; overflow: hidden; background: #0F172A; border-radius: 12px; }
  .carousel-track { display: flex; height: 100%; transition: transform 0.4s ease; }
  .carousel-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; user-select: none; }
  .carousel-btns { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 5; }
  .carousel-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(15,23,42,0.7); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 18px; user-select: none; }
  .carousel-btn:active { background: #22C55E; }
  .carousel-dots { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
  .carousel-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .carousel-dot.active { background: #22C55E; }
</style>
</head>
<body>
  <h1>Carousel Test</h1>
  <p>Click the ‹ › buttons below. If this works, the carousel code itself is fine and something else on your real page is interfering. If this <b>doesn't</b> work either, it's your browser/environment, not the code.</p>

  <div id="carouselHolder"></div>

  <div id="log"><b>Click log:</b></div>

  <script>
    const photos = [
      "https://mbjplutwsxtmdmmwdoxs.supabase.co/storage/v1/object/public/room-images/75181934-bc35-4e6a-b5dd-08ef1d88fcad/1786470796826-ilcoj1dtpkd.jpeg",
      "https://mbjplutwsxtmdmmwdoxs.supabase.co/storage/v1/object/public/room-images/75181934-bc35-4e6a-b5dd-08ef1d88fcad/1786470796826-170m8mvbfjb.jpeg",
      "https://mbjplutwsxtmdmmwdoxs.supabase.co/storage/v1/object/public/room-images/75181934-bc35-4e6a-b5dd-08ef1d88fcad/1786470796825-frzcmzkml0o.jpeg",
      "https://mbjplutwsxtmdmmwdoxs.supabase.co/storage/v1/object/public/room-images/75181934-bc35-4e6a-b5dd-08ef1d88fcad/1786470796826-nr14d020v9f.jpeg",
      "https://mbjplutwsxtmdmmwdoxs.supabase.co/storage/v1/object/public/room-images/75181934-bc35-4e6a-b5dd-08ef1d88fcad/1786470796826-rbrlk5x7nl.jpeg"
    ];

    const log = document.getElementById('log');
    function logMsg(msg) {
      const d = document.createElement('div');
      d.textContent = msg;
      log.appendChild(d);
    }

    document.getElementById('carouselHolder').innerHTML = `
      <div class="carousel-wrap">
        <div class="carousel-dots" id="carouselDots">
          ${photos.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></div>`).join('')}
        </div>
        <div class="carousel-track" id="carouselTrack">
          ${photos.map((img, i) => `<img src="${img}" alt="Photo ${i + 1}" onerror="logMsgGlobal('Image ${i + 1} FAILED to load (broken URL or storage not public)')">`).join('')}
        </div>
        <div class="carousel-btns">
          <div class="carousel-btn" id="carouselPrev">‹</div>
          <div class="carousel-btn" id="carouselNext">›</div>
        </div>
      </div>`;

    window.logMsgGlobal = logMsg;

    const carouselTrack = document.getElementById('carouselTrack');
    if (carouselTrack) {
      logMsg('✅ Carousel track element found in the DOM.');
      let currentIndex = 0;
      const dots = document.querySelectorAll('#carouselDots .carousel-dot');

      function updateCarousel() {
        carouselTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
        logMsg(`→ Now showing photo ${currentIndex + 1} of ${photos.length}`);
      }

      const prevBtn = document.getElementById('carouselPrev');
      const nextBtn = document.getElementById('carouselNext');
      if (!prevBtn || !nextBtn) {
        logMsg('❌ Prev/Next buttons NOT found in the DOM — something is wrong with the HTML.');
      } else {
        logMsg('✅ Prev/Next buttons found and wired up.');
        prevBtn.onclick = () => { currentIndex = (currentIndex - 1 + photos.length) % photos.length; updateCarousel(); };
        nextBtn.onclick = () => { currentIndex = (currentIndex + 1) % photos.length; updateCarousel(); };
        dots.forEach(dot => { dot.onclick = () => { currentIndex = parseInt(dot.dataset.idx); updateCarousel(); }; });
      }
    } else {
      logMsg('❌ Carousel track element NOT found — HTML did not render correctly.');
    }
  </script>
</body>
</html>
