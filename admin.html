<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SJKD3QXPTH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SJKD3QXPTH');
  </script>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/shared.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }
    .pricing-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 20px;
      margin-left: 6px;
    }
    .pricing-monthly { background-color: #22C55E20; color: #22C55E; }
    .pricing-yearly { background-color: #3B82F620; color: #60A5FA; }
    .pricing-both { background-color: #8B5CF620; color: #A78BFA; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }
    body .bg-red-500\/20 { background-color: #7F1D1D; }
    body .text-red-400 { color: #F87171; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }
    body.light-mode .bg-green-600 { background-color: #16A34A; }
    body.light-mode .bg-yellow-600 { background-color: #D97706; }
    body.light-mode table .bg-slate-700 { background-color: #F3F4F6; }

  </style>
</head>
<body data-feedback-auth="required">

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="adminDashboard">StudentStay Admin</h1>
        </div>
      </a>
      <div class="flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="admin.html" class="nav-btn text-primary hover:text-primary" data-i18n="admin">Admin</a>
        <a href="#" id="logoutBtn" class="nav-btn text-slate-300 hover:text-primary" data-i18n="logout">Logout</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div id="adminCheck" class="text-center py-20 text-red-400" data-i18n="loadingText">Checking admin access...</div>
    <div id="adminContent" style="display:none;">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="pendingRooms">Pending Rooms</p>
          <p id="pendingCount" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="applications">Applications</p>
          <p id="appCount" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="totalRooms">Total Rooms</p>
          <p id="totalRoomsCount" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="suggestions">Suggestions</p>
          <p id="feedbackCount" class="text-3xl font-bold text-white">0</p>
        </div>
      </div>
      <div class="flex gap-2 border-b border-slate-700 mb-6">
        <button class="tab-btn active px-4 py-2 font-medium border-b-2 border-primary text-primary" data-tab="rooms" data-i18n="pendingRoomsTab">Pending Rooms</button>
        <button class="tab-btn px-4 py-2 font-medium text-slate-400" data-tab="applications" data-i18n="landlordApplications">Landlord Applications</button>
        <button class="tab-btn px-4 py-2 font-medium text-slate-400" data-tab="feedback" data-i18n="suggestions">Suggestions</button>
      </div>
      <div id="roomsSection"><div id="roomsTable" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"><div class="p-6 text-center text-slate-400" data-i18n="loadingText">Loading...</div></div></div>
      <div id="applicationsSection" style="display:none;"><div id="applicationsTable" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"><div class="p-6 text-center text-slate-400" data-i18n="loadingText">Loading...</div></div></div>
      <div id="feedbackSection" style="display:none;"><div id="feedbackTable" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"><div class="p-6 text-center text-slate-400" data-i18n="loadingText">Loading...</div></div></div>
    </div>
  </div>

  <script>
    // Helper function to get price display text based on pricing type
    // Price math + number formatting live in js/shared.js (getRoomPricing/formatFCFA);
    // this function only owns this page's markup.
    function getPriceDisplayText(room) {
      const { pricingType, monthlyPrice, yearlyPrice } = getRoomPricing(room);
      const perMonthText = t('perMonthBadge');
      const perYearText = t('perYearBadge');
      const bothText = t('bothBadge');
      
      if (pricingType === 'yearly') {
        return `${formatFCFA(yearlyPrice)}<span class="pricing-badge pricing-yearly ml-2">${perYearText}</span>`;
      } 
      else if (pricingType === 'both') {
        return `${formatFCFA(monthlyPrice)}/${perMonthText}<br><span class="text-xs text-slate-400">or ${formatFCFA(yearlyPrice)}/${perYearText}</span><span class="pricing-badge pricing-both ml-2">${bothText}</span>`;
      }
      else {
        return `${formatFCFA(monthlyPrice)}<span class="pricing-badge pricing-monthly ml-2">${perMonthText}</span>`;
      }
    }

    // Dark Mode Toggle
    // Language Toggle Button
    const langToggle = document.getElementById('languageToggle');
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        // Reload admin data after language change
        location.reload();
      });
    }

    window.approveRoom = async (id) => { 
      const { error } = await sb.rpc('approve_room', { room_id: id });
      if (error) { alert(error.message); return; }
      location.reload(); 
    };
    window.deleteRoom = async (id, btn) => { 
      if (confirm(t('confirm') + '?')) { 
        setButtonLoading(btn, true, t('deleting') || 'Deleting...');
        const { error } = await sb.rpc('delete_room', { room_id: id });
        if (error) { alert(error.message); setButtonLoading(btn, false); return; }
        location.reload(); 
      } 
    };
    window.approveApplication = async (appId, userId, role) => { 
      const { error } = await sb.rpc('approve_application', { app_id: appId, new_role: role });
      if (error) { alert(error.message); return; }
      alert(t('approve')); 
      location.reload(); 
    };
    window.rejectApplication = async (appId, btn) => { 
      if (confirm(t('confirm') + '?')) { 
        setButtonLoading(btn, true, t('deleting') || 'Deleting...');
        await sb.rpc('reject_application', { app_id: appId });
        location.reload(); 
      } 
    };
    
    (async () => {
      const { data: sessionData } = await sb.auth.getSession();
      const user = sessionData.session?.user ?? null;
      if (!user) { 
        document.getElementById('adminCheck').innerHTML = '<div class="bg-red-500/20 p-6 rounded-lg text-center"><p class="text-red-400">' + t('loginTitle') + ' required</p><a href="login.html" class="mt-4 inline-block bg-primary text-white px-4 py-2 rounded-lg">' + t('login') + '</a></div>'; 
        return; 
      }
      currentUser = user;
      const { data: profileRow } = await sb.from('profiles').select('role').eq('id', user.id).single();
      if (!profileRow || profileRow.role !== 'admin') { 
        document.getElementById('adminCheck').innerHTML = '<div class="bg-red-500/20 p-6 rounded-lg text-center"><p class="text-red-400">' + t('noData') + '</p><a href="index.html" class="mt-4 inline-block bg-slate-600 text-white px-4 py-2 rounded-lg">' + t('back') + '</a></div>'; 
        return; 
      }
      document.getElementById('adminCheck').style.display = 'none'; 
      document.getElementById('adminContent').style.display = 'block';
      
      const { data: allRooms } = await sb.from('rooms').select('id', { count: 'exact' });
      const { data: pendingRooms } = await sb.from('rooms').select('*, profiles:landlord_id(full_name, email)').eq('status', 'pending');
      const { data: pendingApps } = await sb.from('applications').select('*, profiles:user_id(full_name, phone)').eq('status', 'pending');
      document.getElementById('pendingCount').innerText = (pendingRooms || []).length; 
      document.getElementById('appCount').innerText = (pendingApps || []).length; 
      document.getElementById('totalRoomsCount').innerText = (allRooms || []).length;
      
      const pendingList = pendingRooms || [];
      let roomsHtml = '<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-700"><tr><th class="p-3">' + t('title') + '</th><th class="p-3">' + t('pricing') + '</th><th class="p-3">' + t('city') + '</th><th class="p-3">' + t('listedBy') + '</th><th class="p-3">' + t('actions') + '</th></tr></thead><tbody>';
      
      for (const r of pendingList) { 
        const room = {
          title: r.title, city: r.city,
          pricingType: r.pricing_type, monthlyPrice: r.monthly_price, yearlyPrice: r.yearly_price, price: r.price
        };
        const landlordName = r.profiles?.full_name || r.profiles?.email || 'Unknown';
        
        roomsHtml += `<tr class="border-b border-slate-700">
          <td class="p-3 text-white">${escapeHtml(room.title)}</td>
          <td class="p-3">${getPriceDisplayText(room)}</td>
          <td class="p-3">${escapeHtml(room.city)}</td>
          <td class="p-3 text-slate-300 text-sm">${escapeHtml(landlordName)}</td>
          <td class="p-3">
            <a href="edit-room.html?id=${r.id}" class="bg-yellow-600 text-white px-3 py-1 rounded mr-2 inline-block hover:bg-yellow-700">${t('edit')}</a>
            <button onclick="approveRoom('${r.id}')" class="bg-green-600 text-white px-3 py-1 rounded mr-2">${t('approve')}</button>
            <button onclick="deleteRoom('${r.id}', this)" class="bg-red-600 text-white px-3 py-1 rounded">${t('delete')}</button>
          </td>
         </tr>`;
      }
      roomsHtml += pendingList.length === 0 ? '<tr><td colspan="5" class="p-6 text-center">' + t('noPendingRooms') + '</td></tr>' : ''; 
      roomsHtml += '</tbody></table></div>';
      document.getElementById('roomsTable').innerHTML = roomsHtml;
      
      const appList = pendingApps || [];
      let appsHtml = '<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-700"><tr><th class="p-3">' + t('name') + '</th><th class="p-3">' + t('email') + '</th><th class="p-3">' + t('whatsapp') + '</th><th class="p-3">' + t('requestedRole') + '</th><th class="p-3">' + t('date') + '</th><th class="p-3">' + t('actions') + '</th></tr></thead><tbody>';
      
      for (const a of appList) { 
        const app = { userEmail: a.user_email, requestedRole: a.requested_role, createdAt: a.created_at };
        const userName = a.profiles?.full_name || 'N/A';
        const userPhone = a.profiles?.phone || 'N/A';
        
        appsHtml += `<tr class="border-b border-slate-700">
          <td class="p-3 text-white">${escapeHtml(userName)}</td>
          <td class="p-3">${escapeHtml(app.userEmail)}</td>
          <td class="p-3">${escapeHtml(userPhone)}</td>
          <td class="p-3 capitalize"><span class="px-2 py-1 rounded text-xs ${app.requestedRole === 'landlord' ? 'bg-primary/20 text-primary' : 'bg-blue-500/20 text-blue-400'}">${app.requestedRole}</span></td>
          <td class="p-3">${app.createdAt ? new Date(app.createdAt).toLocaleDateString() : 'N/A'}</td>
          <td class="p-3">
            <button onclick="approveApplication('${a.id}', '${a.user_id}', '${app.requestedRole}')" class="bg-green-600 text-white px-3 py-1 rounded mr-2">${t('approve')}</button>
            <button onclick="rejectApplication('${a.id}', this)" class="bg-red-600 text-white px-3 py-1 rounded">${t('delete')}</button>
          </td>
         </tr>`;
      }
      appsHtml += appList.length === 0 ? '<tr><td colspan="6" class="p-6 text-center">' + t('noPendingApps') + '</td></tr>' : ''; 
      appsHtml += '</tbody></table></div>';
      document.getElementById('applicationsTable').innerHTML = appsHtml;
      
      const { data: feedbackRows } = await sb.from('feedback').select('*').order('created_at', { ascending: false });
      const feedbackList = feedbackRows || [];
      document.getElementById('feedbackCount').innerText = feedbackList.length;
      let feedbackHtml = '<div class="divide-y divide-slate-700">';
      for (const f of feedbackList) {
        feedbackHtml += `<div class="p-4">
          <p class="text-white text-sm">${escapeHtml(f.message)}</p>
          <p class="text-slate-500 text-xs mt-1">${f.created_at ? new Date(f.created_at).toLocaleString() : ''}</p>
        </div>`;
      }
      feedbackHtml += feedbackList.length === 0 ? '<div class="p-6 text-center text-slate-400" data-i18n="noSuggestions">No suggestions yet.</div>' : '';
      feedbackHtml += '</div>';
      document.getElementById('feedbackTable').innerHTML = feedbackHtml;
    })();
    
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => { 
      const tab = btn.dataset.tab; 
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('border-b-2','border-primary','text-primary')); 
      btn.classList.add('border-b-2','border-primary','text-primary'); 
      document.getElementById('roomsSection').style.display = tab === 'rooms' ? 'block' : 'none'; 
      document.getElementById('applicationsSection').style.display = tab === 'applications' ? 'block' : 'none'; 
      document.getElementById('feedbackSection').style.display = tab === 'feedback' ? 'block' : 'none'; 
    });
    document.getElementById('logoutBtn').onclick = () => { sb.auth.signOut().then(() => window.location.href = 'index.html'); };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
<p class="text-center text-xs text-slate-600 py-4"><a href="https://asghinlabs.vercel.app" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: none; font-weight: 500;">a asghinlabs product</a></p>

</body>
</html>
