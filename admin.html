<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/languages.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .text-primary { color: #22C55E; }
    .nav-btn {
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
      font-weight: 500;
    }
    .nav-btn:hover {
      background-color: #22C55E;
      color: white !important;
    }
    .pricing-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 20px;
      margin-left: 6px;
    }
    .pricing-monthly { background-color: #22C55E20; color: #22C55E; }
    .pricing-yearly { background-color: #3B82F620; color: #60A5FA; }
    .pricing-both { background-color: #8B5CF620; color: #A78BFA; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }
    body .bg-red-500\/20 { background-color: #7F1D1D; }
    body .text-red-400 { color: #F87171; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }
    body.light-mode .bg-green-600 { background-color: #16A34A; }
    body.light-mode .bg-yellow-600 { background-color: #D97706; }
    body.light-mode table .bg-slate-700 { background-color: #F3F4F6; }

    /* Navbar stays dark with white text in both modes */
    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }

    /* Language Selection Modal */
    .lang-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: all 0.3s ease;
    }
    .lang-modal {
        background: #1E293B;
        border-radius: 24px;
        padding: 32px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        border: 1px solid #334155;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: modalFadeIn 0.3s ease;
    }
    body.light-mode .lang-modal {
        background: #FFFFFF;
        border-color: #E5E7EB;
    }
    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    .lang-flag {
        font-size: 48px;
        margin-bottom: 16px;
    }
    .lang-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 8px;
    }
    .lang-subtitle {
        font-size: 14px;
        color: #94A3B8;
        margin-bottom: 24px;
    }
    .lang-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .lang-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px 24px;
        background: #334155;
        border: 2px solid #475569;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 120px;
    }
    .lang-btn:hover {
        transform: translateY(-2px);
        border-color: #22C55E;
        background: #22C55E20;
    }
    .lang-btn-flag {
        font-size: 32px;
    }
    .lang-btn-text {
        font-size: 18px;
        font-weight: 600;
    }
    .lang-btn-sub {
        font-size: 12px;
        color: #94A3B8;
    }
    body.light-mode .lang-btn {
        background: #F3F4F6;
        border-color: #E5E7EB;
    }
    body.light-mode .lang-btn:hover {
        background: #22C55E10;
        border-color: #22C55E;
    }
    .hidden-modal {
        display: none !important;
    }
  </style>
</head>
<body>
  <!-- Language Selection Modal -->
  <div id="languageModal" class="lang-modal-overlay">
      <div class="lang-modal">
          <div class="lang-flag">🇨🇲</div>
          <h2 class="lang-title" data-i18n="modalWelcome">Welcome to StudentStay</h2>
          <p class="lang-subtitle" data-i18n="modalSubtitle">Bienvenue sur StudentStay</p>
          <div class="lang-buttons">
              <div class="lang-btn" onclick="selectLanguage('en')">
                  <div class="lang-btn-flag">🇬🇧</div>
                  <div class="lang-btn-text" data-i18n="modalEnglish">English</div>
                  <div class="lang-btn-sub" data-i18n="modalEnglishSub">Continue in English</div>
              </div>
              <div class="lang-btn" onclick="selectLanguage('fr')">
                  <div class="lang-btn-flag">🇫🇷</div>
                  <div class="lang-btn-text" data-i18n="modalFrench">Français</div>
                  <div class="lang-btn-sub" data-i18n="modalFrenchSub">Continuer en français</div>
              </div>
          </div>
      </div>
  </div>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="adminDashboard">StudentStay Admin</h1>
        </div>
      </a>
      <div class="flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="admin.html" class="nav-btn text-primary hover:text-primary" data-i18n="admin">Admin</a>
        <a href="#" id="logoutBtn" class="nav-btn text-slate-300 hover:text-primary" data-i18n="logout">Logout</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div id="adminCheck" class="text-center py-20 text-red-400" data-i18n="loadingText">Checking admin access...</div>
    <div id="adminContent" style="display:none;">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="pendingRooms">Pending Rooms</p>
          <p id="pendingCount" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="applications">Applications</p>
          <p id="appCount" class="text-3xl font-bold text-white">0</p>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 text-center">
          <p class="text-slate-400" data-i18n="totalRooms">Total Rooms</p>
          <p id="totalRoomsCount" class="text-3xl font-bold text-white">0</p>
        </div>
      </div>
      <div class="flex gap-2 border-b border-slate-700 mb-6">
        <button class="tab-btn active px-4 py-2 font-medium border-b-2 border-primary text-primary" data-tab="rooms" data-i18n="pendingRoomsTab">Pending Rooms</button>
        <button class="tab-btn px-4 py-2 font-medium text-slate-400" data-tab="applications" data-i18n="landlordApplications">Landlord Applications</button>
      </div>
      <div id="roomsSection"><div id="roomsTable" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"><div class="p-6 text-center text-slate-400" data-i18n="loadingText">Loading...</div></div></div>
      <div id="applicationsSection" style="display:none;"><div id="applicationsTable" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden"><div class="p-6 text-center text-slate-400" data-i18n="loadingText">Loading...</div></div></div>
    </div>
  </div>

  <script>
    // Helper function to get price display text based on pricing type
    function getPriceDisplayText(room) {
      const pricingType = room.pricingType || 'monthly';
      const perMonthText = t('perMonthBadge');
      const perYearText = t('perYearBadge');
      const bothText = t('bothBadge');
      
      if (pricingType === 'yearly') {
        const yearlyPrice = room.yearlyPrice || room.price || 0;
        return `${yearlyPrice.toLocaleString()} FCFA<span class="pricing-badge pricing-yearly ml-2">${perYearText}</span>`;
      } 
      else if (pricingType === 'both') {
        const monthlyPrice = room.monthlyPrice || room.price || 0;
        const yearlyPrice = room.yearlyPrice || (monthlyPrice * 9) || 0;
        return `${monthlyPrice.toLocaleString()} FCFA/${perMonthText}<br><span class="text-xs text-slate-400">or ${yearlyPrice.toLocaleString()} FCFA/${perYearText}</span><span class="pricing-badge pricing-both ml-2">${bothText}</span>`;
      }
      else {
        const monthlyPrice = room.monthlyPrice || room.price || 0;
        return `${monthlyPrice.toLocaleString()} FCFA<span class="pricing-badge pricing-monthly ml-2">${perMonthText}</span>`;
      }
    }

    // Dark Mode Toggle
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    // Language Toggle Button
    const langToggle = document.getElementById('languageToggle');
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        // Reload admin data after language change
        location.reload();
      });
    }

    window.approveRoom = async (id) => { 
      await db.collection('rooms').doc(id).update({ status: 'approved', expiresAt: new Date(Date.now() + 30*24*60*60*1000) }); 
      location.reload(); 
    };
    window.deleteRoom = async (id) => { 
      if (confirm(t('confirm') + '?')) { 
        await db.collection('rooms').doc(id).delete(); 
        location.reload(); 
      } 
    };
    window.approveApplication = async (appId, userId, role) => { 
      await db.collection('users').doc(userId).update({ role: role, freeListingsRemaining: 5 }); 
      await db.collection('applications').doc(appId).update({ status: 'approved', reviewedAt: new Date() }); 
      alert(t('approve')); 
      location.reload(); 
    };
    window.rejectApplication = async (appId) => { 
      if (confirm(t('confirm') + '?')) { 
        await db.collection('applications').doc(appId).update({ status: 'rejected', reviewedAt: new Date() }); 
        location.reload(); 
      } 
    };
    
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { 
        document.getElementById('adminCheck').innerHTML = '<div class="bg-red-500/20 p-6 rounded-lg text-center"><p class="text-red-400">' + t('loginTitle') + ' required</p><a href="login.html" class="mt-4 inline-block bg-primary text-white px-4 py-2 rounded-lg">' + t('login') + '</a></div>'; 
        return; 
      }
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (!userDoc.exists || userDoc.data().role !== 'admin') { 
        document.getElementById('adminCheck').innerHTML = '<div class="bg-red-500/20 p-6 rounded-lg text-center"><p class="text-red-400">' + t('noData') + '</p><a href="index.html" class="mt-4 inline-block bg-slate-600 text-white px-4 py-2 rounded-lg">' + t('back') + '</a></div>'; 
        return; 
      }
      document.getElementById('adminCheck').style.display = 'none'; 
      document.getElementById('adminContent').style.display = 'block';
      
      const rooms = await db.collection('rooms').get(); 
      const pending = await db.collection('rooms').where('status','==','pending').get(); 
      const apps = await db.collection('applications').where('status','==','pending').get();
      document.getElementById('pendingCount').innerText = pending.size; 
      document.getElementById('appCount').innerText = apps.size; 
      document.getElementById('totalRoomsCount').innerText = rooms.size;
      
      const pendingSnapshot = await db.collection('rooms').where('status','==','pending').get();
      let roomsHtml = '<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-700"><tr><th class="p-3">' + t('title') + '</th><th class="p-3">' + t('pricing') + '</th><th class="p-3">' + t('city') + '</th><th class="p-3">' + t('listedBy') + '</th><th class="p-3">' + t('actions') + '</th></tr></thead><tbody>';
      
      for (const doc of pendingSnapshot.docs) { 
        const room = doc.data(); 
        let landlordName = 'Unknown';
        if (room.landlordId) {
          const landlordDoc = await db.collection('users').doc(room.landlordId).get();
          if (landlordDoc.exists) {
            landlordName = landlordDoc.data().fullName || landlordDoc.data().email || 'Unknown';
          }
        }
        
        roomsHtml += `<tr class="border-b border-slate-700">
          <td class="p-3 text-white">${escapeHtml(room.title)}</td>
          <td class="p-3">${getPriceDisplayText(room)}</td>
          <td class="p-3">${escapeHtml(room.city)}</td>
          <td class="p-3 text-slate-300 text-sm">${escapeHtml(landlordName)}</td>
          <td class="p-3">
            <a href="edit-room.html?id=${doc.id}" class="bg-yellow-600 text-white px-3 py-1 rounded mr-2 inline-block hover:bg-yellow-700">${t('edit')}</a>
            <button onclick="approveRoom('${doc.id}')" class="bg-green-600 text-white px-3 py-1 rounded mr-2">${t('approve')}</button>
            <button onclick="deleteRoom('${doc.id}')" class="bg-red-600 text-white px-3 py-1 rounded">${t('delete')}</button>
          </td>
         </tr>`;
      }
      roomsHtml += pendingSnapshot.empty ? '<tr><td colspan="5" class="p-6 text-center">' + t('noPendingRooms') + '</td></tr>' : ''; 
      roomsHtml += '</tbody></table></div>';
      document.getElementById('roomsTable').innerHTML = roomsHtml;
      
      const appSnapshot = await db.collection('applications').where('status','==','pending').get();
      let appsHtml = '<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-700"><tr><th class="p-3">' + t('name') + '</th><th class="p-3">' + t('email') + '</th><th class="p-3">' + t('whatsapp') + '</th><th class="p-3">' + t('requestedRole') + '</th><th class="p-3">' + t('date') + '</th><th class="p-3">' + t('actions') + '</th></tr></thead><tbody>';
      
      for (const doc of appSnapshot.docs) { 
        const app = doc.data(); 
        let userName = 'N/A';
        let userPhone = 'N/A';
        if (app.userId) {
          const userDoc = await db.collection('users').doc(app.userId).get();
          if (userDoc.exists) {
            userName = userDoc.data().fullName || 'N/A';
            userPhone = userDoc.data().phone || 'N/A';
          }
        }
        
        appsHtml += `<tr class="border-b border-slate-700">
          <td class="p-3 text-white">${escapeHtml(userName)}</td>
          <td class="p-3">${escapeHtml(app.userEmail)}</td>
          <td class="p-3">${escapeHtml(userPhone)}</td>
          <td class="p-3 capitalize"><span class="px-2 py-1 rounded text-xs ${app.requestedRole === 'landlord' ? 'bg-primary/20 text-primary' : 'bg-blue-500/20 text-blue-400'}">${app.requestedRole}</span></td>
          <td class="p-3">${app.createdAt?.toDate().toLocaleDateString() || 'N/A'}</td>
          <td class="p-3">
            <button onclick="approveApplication('${doc.id}', '${app.userId}', '${app.requestedRole}')" class="bg-green-600 text-white px-3 py-1 rounded mr-2">${t('approve')}</button>
            <button onclick="rejectApplication('${doc.id}')" class="bg-red-600 text-white px-3 py-1 rounded">${t('delete')}</button>
          </td>
         </tr>`;
      }
      appsHtml += appSnapshot.empty ? '<tr><td colspan="6" class="p-6 text-center">' + t('noPendingApps') + '</td></tr>' : ''; 
      appsHtml += '</tbody></table></div>';
      document.getElementById('applicationsTable').innerHTML = appsHtml;
    });
    
    // Escape HTML to prevent XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => { 
      const tab = btn.dataset.tab; 
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('border-b-2','border-primary','text-primary')); 
      btn.classList.add('border-b-2','border-primary','text-primary'); 
      document.getElementById('roomsSection').style.display = tab === 'rooms' ? 'block' : 'none'; 
      document.getElementById('applicationsSection').style.display = tab === 'applications' ? 'block' : 'none'; 
    });
    document.getElementById('logoutBtn').onclick = () => { firebase.auth().signOut(); window.location.href = 'index.html'; };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
</body>
</html>
