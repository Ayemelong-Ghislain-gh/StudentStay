<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Room - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .preview-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; }
    .remove-image { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    .existing-image { position: relative; display: inline-block; margin: 5px; }
    .remove-existing { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    input[type="file"]::file-selector-button {
      background-color: white;
      color: black;
      border: 1px solid #ccc;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px;
      transition: background-color 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
      background-color: #f0f0f0;
    }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-blue-500\/20 { background-color: #DBEAFE !important; }
    body.light-mode .text-blue-400 { color: #2563EB !important; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }

    /* Navbar stays dark with white text in both modes */
    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav p,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }
    body.light-mode #mobileMenu {
      background-color: #1E293B !important;
    }
    body.light-mode #mobileMenu a,
    body.light-mode #mobileMenu button {
      color: #FFFFFF !important;
    }
  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2"><div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-sm">S</span></div><div><h1 class="text-xl font-bold text-white">StudentStay</h1><p class="text-xs text-slate-300">Find Rooms. No Stress.</p></div></a>
      <!-- DESKTOP MENU -->
      <div class="hidden md:flex gap-4">
        <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
        <a href="listings.html" class="text-slate-300 hover:text-primary text-sm">Browse</a>
        <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">Dashboard</a>
        <a href="#" id="desktopLogoutBtn" class="text-slate-300 hover:text-primary text-sm">Login</a>
        <button id="installAppBtn" style="display:none; background:#22C55E; color:white; border:none; padding:4px 12px; border-radius:8px;">📲 Install</button>
        <button id="darkModeToggle" class="text-slate-300 hover:text-primary text-sm">🌓 Dark/Light</button>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <!-- MOBILE MENU -->
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-3">
      <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
      <a href="listings.html" class="text-slate-300 hover:text-primary text-sm">Browse</a>
      <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">Dashboard</a>
      <a href="#" id="mobileLogoutBtn" class="text-slate-300 hover:text-primary text-sm">Login</a>
      <button id="mobileInstallAppBtn" style="display:none; background:#22C55E; color:white; border:none; padding:8px 16px; border-radius:8px;">📲 Install App</button>
      <button id="mobileDarkModeToggle" class="text-slate-300 hover:text-primary text-sm text-left">🌓 Dark/Light</button>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <h1 class="text-2xl font-bold text-white mb-2">Edit Room</h1>
      <div id="messageArea" class="hidden mb-4 p-3 rounded-lg"></div>
      <div id="loadingArea" class="text-center py-10 text-slate-400">Loading...</div>
      
      <form id="roomForm" style="display:none;">
        <input type="hidden" id="roomId">
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Title *</label><input type="text" id="title" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Price (FCFA) *</label><input type="number" id="price" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="grid grid-cols-2 gap-4 mb-4"><div><label class="block text-slate-300 text-sm font-semibold mb-1">City *</label><select id="city" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"><option value="Bambili">Bambili</option><option value="Bamenda">Bamenda</option><option value="Mankon">Mankon</option><option value="Up Station">Up Station</option><option value="Nkwen">Nkwen</option></select></div><div><label class="block text-slate-300 text-sm font-semibold mb-1">Area</label><input type="text" id="area" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Distance (km) *</label><input type="number" id="distance" step="0.1" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Description *</label><textarea id="description" rows="4" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></textarea></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Features (comma)</label><input type="text" id="features" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">WhatsApp *</label><input type="tel" id="phone" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></div>
        
        <!-- Existing Images -->
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Current Images</label><div id="existingImagesContainer" class="flex flex-wrap gap-2"></div></div>
        
        <!-- Add New Images (white button) -->
        <div class="mb-4"><label class="block text-slate-300 text-sm font-semibold mb-1">Add New Images (max 5 total)</label><input type="file" id="newImagesInput" accept="image/*" multiple class="w-full text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:bg-white file:text-black file:font-semibold file:border file:border-gray-300 file:cursor-pointer file:hover:bg-gray-100"><div id="newPreviewContainer" class="flex flex-wrap gap-2 mt-3"></div></div>
        
        <div class="flex gap-3"><button type="submit" class="flex-1 bg-primary text-white py-3 rounded-lg font-semibold hover:bg-green-600">Save Changes</button><button type="button" id="deleteBtn" class="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700">Delete Room</button></div>
      </form>
    </div>
  </div>

  <script>
    // Dark Mode Toggle
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });
    document.getElementById('mobileDarkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    // Mobile menu toggle
    document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));

    const IMGBB_API_KEY = '4d01c952d0e4fd8cd5cc6d81ef0fd025';
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    let existingImages = [];
    let imagesToKeep = [];
    let newFiles = [];
    
    if (!roomId) { document.getElementById('loadingArea').innerHTML = '<div class="text-center text-red-400">No room ID</div>'; }
    
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      // Handle logout buttons
      const desktopLogout = document.getElementById('desktopLogoutBtn');
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (desktopLogout) { desktopLogout.textContent = 'Logout'; desktopLogout.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
      if (mobileLogout) { mobileLogout.textContent = 'Logout'; mobileLogout.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
      
      const doc = await db.collection('rooms').doc(roomId).get();
      if (!doc.exists) { document.getElementById('loadingArea').innerHTML = '<div class="text-center text-red-400">Room not found</div>'; return; }
      const room = doc.data();
      existingImages = room.images || [];
      imagesToKeep = [...existingImages];
      
      document.getElementById('roomId').value = roomId;
      document.getElementById('title').value = room.title || '';
      document.getElementById('price').value = room.price || '';
      document.getElementById('city').value = room.city || 'Bambili';
      document.getElementById('area').value = room.area || '';
      document.getElementById('distance').value = room.distance || '';
      document.getElementById('description').value = room.description || '';
      document.getElementById('features').value = (room.features || []).join(', ');
      document.getElementById('phone').value = room.phone || '';
      
      displayExistingImages();
      document.getElementById('loadingArea').style.display = 'none';
      document.getElementById('roomForm').style.display = 'block';
    });
    
    function displayExistingImages() {
      const container = document.getElementById('existingImagesContainer');
      if (imagesToKeep.length === 0) { container.innerHTML = '<p class="text-slate-400 text-sm">No images. Add some below.</p>'; return; }
      container.innerHTML = imagesToKeep.map((img, idx) => `<div class="existing-image"><img src="${img}" class="preview-image"><div class="remove-existing" onclick="removeExistingImage(${idx})">×</div></div>`).join('');
    }
    
    function removeExistingImage(idx) { imagesToKeep.splice(idx, 1); displayExistingImages(); }
    
    const newImagesInput = document.getElementById('newImagesInput');
    const newPreviewContainer = document.getElementById('newPreviewContainer');
    
    newImagesInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      const total = imagesToKeep.length + newFiles.length + files.length;
      if (total > 10) { alert('Max 10 images total'); newImagesInput.value = ''; return; }
      files.forEach(file => {
        if (file.size > 32*1024*1024) { alert(`${file.name} > 32MB`); return; }
        newFiles.push(file);
        const reader = new FileReader();
        reader.onload = (ev) => {
          const div = document.createElement('div'); div.className = 'relative inline-block';
          div.innerHTML = `<img src="${ev.target.result}" class="preview-image"><div class="remove-image" onclick="this.parentElement.remove(); removeNewFile('${file.name}')">×</div>`;
          newPreviewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
      newImagesInput.value = '';
    });
    
    function removeNewFile(fileName) { newFiles = newFiles.filter(f => f.name !== fileName); }
    
    async function uploadNewImages() {
      const urls = [];
      for (const file of newFiles) {
        const fd = new FormData(); fd.append('key', IMGBB_API_KEY); fd.append('image', file);
        const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!data.success) throw new Error('Upload failed');
        urls.push(data.data.url);
      }
      return urls;
    }
    
    document.getElementById('roomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgDiv = document.getElementById('messageArea');
      msgDiv.classList.remove('hidden'); msgDiv.className = 'mb-4 p-3 rounded-lg bg-blue-500/20 text-blue-400';
      msgDiv.innerHTML = 'Saving...';
      try {
        const newUrls = await uploadNewImages();
        const allImages = [...imagesToKeep, ...newUrls];
        await db.collection('rooms').doc(roomId).update({
          title: document.getElementById('title').value, price: parseInt(document.getElementById('price').value),
          city: document.getElementById('city').value, area: document.getElementById('area').value || null,
          distance: parseFloat(document.getElementById('distance').value), description: document.getElementById('description').value,
          features: document.getElementById('features').value.split(',').map(f=>f.trim()),
          phone: document.getElementById('phone').value, images: allImages.slice(0,10)
        });
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-green-500/20 text-green-400';
        msgDiv.innerHTML = '✅ Room updated! Redirecting...';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
      } catch (error) {
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-red-500/20 text-red-400';
        msgDiv.innerHTML = 'Error: ' + error.message;
      }
    });
    
    document.getElementById('deleteBtn').onclick = async () => {
      if (confirm('Delete permanently?')) { await db.collection('rooms').doc(roomId).delete(); window.location.href = 'dashboard.html'; }
    };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>

  <!-- PWA Install Script -->
  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const desktopBtn = document.getElementById('installAppBtn');
      const mobileBtn = document.getElementById('mobileInstallAppBtn');
      if (desktopBtn) desktopBtn.style.display = 'inline-block';
      if (mobileBtn) mobileBtn.style.display = 'inline-block';
    });

    function handleInstall(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.addEventListener('click', () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
              if (choice.outcome === 'accepted') console.log('User installed PWA');
              deferredPrompt = null;
              const desktopBtn = document.getElementById('installAppBtn');
              const mobileBtn = document.getElementById('mobileInstallAppBtn');
              if (desktopBtn) desktopBtn.style.display = 'none';
              if (mobileBtn) mobileBtn.style.display = 'none';
            });
          }
        });
      }
    }
    handleInstall('installAppBtn');
    handleInstall('mobileInstallAppBtn');
  </script>
</body>
</html>
