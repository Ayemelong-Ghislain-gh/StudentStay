<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Room - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/phone-validation.js"></script>
  <script src="js/shared.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .preview-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; }
    .preview-image.is-cover { border: 2px solid #22C55E; }
    .remove-image { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    .existing-image { position: relative; display: inline-block; margin: 5px; }
    .remove-existing { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    .cover-star { position: absolute; bottom: -8px; left: -8px; background: #334155; color: #94a3b8; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; border: 1px solid #1e293b; }
    .cover-badge { position: absolute; bottom: -8px; left: -8px; background: #22C55E; color: white; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
    input[type="file"]::file-selector-button {
      background-color: white;
      color: black;
      border: 1px solid #ccc;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px;
      transition: background-color 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
      background-color: #f0f0f0;
    }

    /* Searchable dropdown styles */
    .searchable-dropdown {
      position: relative;
    }
    .dropdown-input {
      width: 100%;
      background-color: #334155;
      border: 1px solid #475569;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background-color: #1E293B;
      border: 1px solid #475569;
      border-radius: 8px;
      z-index: 10;
      display: none;
    }
    .dropdown-list.show { display: block; }
    .dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
      color: #CBD5E1;
    }
    .dropdown-item:hover { background-color: #22C55E; color: white; }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-blue-500\/20 { background-color: #DBEAFE !important; }
    body.light-mode .text-blue-400 { color: #2563EB !important; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .bg-red-500\/20 { background-color: #FEE2E2 !important; }
    body.light-mode .text-red-400 { color: #DC2626 !important; }
    body.light-mode .dropdown-list { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .dropdown-item { color: #374151; }
    body.light-mode .dropdown-input { background-color: #F3F4F6; border-color: #E5E7EB; color: #111827; }

    /* Navbar stays dark with white text in both modes */

  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="appName">StudentStay</h1>
          <p class="text-xs text-slate-300" data-i18n="tagline">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="browse">Browse</a>
        <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="dashboard">Dashboard</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
        <a href="#" id="desktopLogoutBtn" class="nav-btn text-slate-300 hover:text-primary" data-i18n="login">Login</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left" data-i18n="home">Home</a>
      <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="browse">Browse</a>
      <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="dashboard">Dashboard</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full" data-i18n="darkLight">🌓 Dark/Light</button>
      <button id="mobileLanguageToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌐 FR/EN</button>
      <a href="#" id="mobileLogoutBtn" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="login">Login</a>
    </div>
  </nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <h1 class="text-2xl font-bold text-white mb-2" data-i18n="editRoomTitle">Edit Room</h1>
      <div id="messageArea" class="hidden mb-4 p-3 rounded-lg"></div>
      <div id="loadingArea" class="text-center py-10 text-slate-400" data-i18n="loadingText">Loading...</div>
      
      <form id="roomForm" style="display:none;">
        <input type="hidden" id="roomId">
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="titleLabel">Title *</label>
          <input type="text" id="title" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
        </div>
        
        <!-- PRICING SECTION -->
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="pricingTypeLabel2">Pricing Type *</label>
          <select id="pricingType" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
            <option value="monthly" data-i18n="monthlyOption">Monthly (per month)</option>
            <option value="yearly" data-i18n="yearlyOption2">Yearly (per school year)</option>
            <option value="both" data-i18n="bothOption">Both (monthly & yearly)</option>
          </select>
        </div>
        
        <div class="mb-4" id="monthlyPriceDiv">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="monthlyPriceLabel">Price (FCFA/month) *</label>
          <input type="number" id="monthlyPrice" step="5000" min="0" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
          <p class="text-slate-500 text-xs mt-1" data-i18n="monthlyHint">For monthly payment option</p>
        </div>
        
        <div class="mb-4" id="yearlyPriceDiv" style="display:none;">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="yearlyPriceLabel">Price (FCFA/school year) *</label>
          <input type="number" id="yearlyPrice" step="5000" min="0" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
          <p class="text-slate-500 text-xs mt-1" data-i18n="yearlyHint">Most students pay per school year (9-10 months)</p>
        </div>
        
        <!-- LOCATION SECTION with search -->
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="cityLabel2">City / Town *</label>
          <div class="searchable-dropdown">
            <input type="text" id="citySearch" placeholder="" class="dropdown-input" autocomplete="off" data-i18n-placeholder="searchCity">
            <div id="cityDropdownList" class="dropdown-list"></div>
          </div>
          <input type="hidden" id="selectedCity" required>
        </div>
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="areaLabel">Neighborhood/Area (optional)</label>
          <input type="text" id="area" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
        </div>
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="distanceLabel">Distance (km from University) *</label>
          <input type="number" id="distance" step="0.1" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
        </div>
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="descriptionLabel">Description *</label>
          <textarea id="description" rows="4" required class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2"></textarea>
        </div>
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="featuresLabel">Features (comma separated)</label>
          <input type="text" id="features" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2" data-i18n-placeholder="featuresHint">
        </div>
        
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="whatsappLabel">WhatsApp Number *</label>
          <input type="tel" id="phone" required placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2" data-i18n-placeholder="whatsappHint">
        </div>
        
        <!-- Existing Images -->
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="currentImages">Current Images</label>
          <div id="existingImagesContainer" class="flex flex-wrap gap-2"></div>
        </div>
        
        <!-- Add New Images -->
        <div class="mb-4">
          <label class="block text-slate-300 text-sm font-semibold mb-1" data-i18n="addNewImages">Add New Images (max 10 total)</label>
          <input type="file" id="newImagesInput" accept="image/*" multiple class="w-full text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:bg-white file:text-black file:font-semibold file:border file:border-gray-300 file:cursor-pointer file:hover:bg-gray-100">
          <div id="newPreviewContainer" class="flex flex-wrap gap-2 mt-3"></div>
        </div>
        
        <div class="flex gap-3">
          <button type="submit" id="saveChangesBtn" class="flex-1 bg-primary text-white py-3 rounded-lg font-semibold hover:bg-green-600" data-i18n="saveChanges">Save Changes</button>
          <button type="button" id="deleteBtn" class="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700" data-i18n="deleteRoom">Delete Room</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Complete list of Cameroonian cities (all university zones)
    const CAMEROON_CITIES = [
      "Bamenda", "Bambili", "Mankon", "Nkwen", "Up Station",
      "Buea", "Limbe", "Kumba", "Tiko",
      "Douala", "Bonaberi", "Nkongsamba", "Edéa",
      "Yaoundé", "Soa", "Mbalmayo", "Ebolowa", "Mfou",
      "Dschang", "Bafoussam", "Bangangté", "Foumban", "Mbouda",
      "Ngaoundéré", "Tibati", "Meiganga",
      "Maroua", "Mokolo", "Kousséri",
      "Garoua", "Rey Bouba", "Lagdo",
      "Bertoua", "Batouri", "Abong-Mbang",
      "Kumbo", "Ndop", "Fundong", "Bali", "Santa", "Wum"
    ].sort();

    // Initialize searchable dropdown
    function initSearchableDropdown() {
      const searchInput = document.getElementById('citySearch');
      const dropdownList = document.getElementById('cityDropdownList');
      const hiddenInput = document.getElementById('selectedCity');
      
      function renderCities(filter = '') {
        const filtered = CAMEROON_CITIES.filter(city => 
          city.toLowerCase().includes(filter.toLowerCase())
        );
        if (filtered.length === 0) {
          dropdownList.innerHTML = '<div class="dropdown-item text-slate-500">No cities found. Type a valid city.</div>';
        } else {
          dropdownList.innerHTML = filtered.map(city => 
            `<div class="dropdown-item" data-city="${city}">${city}</div>`
          ).join('');
        }
        dropdownList.classList.add('show');
        
        document.querySelectorAll('.dropdown-item[data-city]').forEach(item => {
          item.addEventListener('click', () => {
            const city = item.dataset.city;
            searchInput.value = city;
            hiddenInput.value = city;
            dropdownList.classList.remove('show');
          });
        });
      }
      
      searchInput.addEventListener('input', (e) => renderCities(e.target.value));
      searchInput.addEventListener('focus', () => renderCities(searchInput.value));
      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) {
          dropdownList.classList.remove('show');
        }
      });
      
      renderCities('');
    }

    // Pricing type toggle function
    function initPricingToggle() {
      const pricingType = document.getElementById('pricingType');
      const monthlyDiv = document.getElementById('monthlyPriceDiv');
      const yearlyDiv = document.getElementById('yearlyPriceDiv');
      const monthlyInput = document.getElementById('monthlyPrice');
      const yearlyInput = document.getElementById('yearlyPrice');
      
      function updatePricingFields() {
        const type = pricingType.value;
        if (type === 'monthly') {
          monthlyDiv.style.display = 'block';
          yearlyDiv.style.display = 'none';
          monthlyInput.required = true;
          yearlyInput.required = false;
        } else if (type === 'yearly') {
          monthlyDiv.style.display = 'none';
          yearlyDiv.style.display = 'block';
          monthlyInput.required = false;
          yearlyInput.required = true;
        } else {
          monthlyDiv.style.display = 'block';
          yearlyDiv.style.display = 'block';
          monthlyInput.required = true;
          yearlyInput.required = true;
        }
      }
      
      pricingType.addEventListener('change', updatePricingFields);
      return updatePricingFields;
    }

    // Dark mode functions
    // Language Toggle Buttons
    const langToggle = document.getElementById('languageToggle');
    const mobileLangToggle = document.getElementById('mobileLanguageToggle');
    
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        updatePageLanguage();
        // Re-populate dropdown placeholder after language change
        const citySearch = document.getElementById('citySearch');
        if (citySearch) citySearch.placeholder = t('searchCity');
      });
    }
    if (mobileLangToggle) {
      mobileLangToggle.addEventListener('click', () => {
        toggleLanguage();
        updatePageLanguage();
        const citySearch = document.getElementById('citySearch');
        if (citySearch) citySearch.placeholder = t('searchCity');
      });
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    let existingImages = [];
    let imagesToKeep = [];
    // Each entry: { id: uuid, file: File, url: objectURL } — tracked by id
    // instead of filename so two files with the same name never collide.
    let newImages = [];
    
    if (!roomId) { document.getElementById('loadingArea').innerHTML = '<div class="text-center text-red-400">No room ID</div>'; }
    
    (async () => {
      const { data: sessionData } = await sb.auth.getSession();
      const user = sessionData.session?.user ?? null;
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      
      const desktopLogout = document.getElementById('desktopLogoutBtn');
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (desktopLogout) { 
        desktopLogout.textContent = t('logout'); 
        desktopLogout.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; 
      }
      if (mobileLogout) { 
        mobileLogout.textContent = t('logout'); 
        mobileLogout.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; 
      }
      
      const { data: r, error } = await sb.from('rooms').select('*').eq('id', roomId).single();
      if (error || !r) { document.getElementById('loadingArea').innerHTML = '<div class="text-center text-red-400">Room not found</div>'; return; }

      // Ownership verification: only the listing's owner or an admin may edit it.
      const { data: profileRow } = await sb.from('profiles').select('role').eq('id', user.id).single();
      const isAdmin = profileRow?.role === 'admin';
      if (r.landlord_id !== user.id && !isAdmin) {
        sessionStorage.setItem('dashboardError', t('notAuthorizedEdit') || "You don't have permission to edit that listing.");
        window.location.href = 'dashboard.html';
        return;
      }

      const room = {
        title: r.title, city: r.city, area: r.area, distance: r.distance, description: r.description,
        features: r.features, images: r.images, phone: r.phone,
        pricingType: r.pricing_type, monthlyPrice: r.monthly_price, yearlyPrice: r.yearly_price, price: r.price
      };
      existingImages = room.images || [];
      imagesToKeep = [...existingImages];
      coverKey = imagesToKeep[0] || null;
      
      // Populate form with existing room data
      document.getElementById('roomId').value = roomId;
      document.getElementById('title').value = room.title || '';
      
      // Handle pricing type and prices
      const pricingType = room.pricingType || 'monthly';
      document.getElementById('pricingType').value = pricingType;
      document.getElementById('monthlyPrice').value = room.monthlyPrice || room.price || '';
      document.getElementById('yearlyPrice').value = room.yearlyPrice || '';
      
      // Update pricing fields visibility
      const updatePricing = initPricingToggle();
      updatePricing();
      
      // Handle city
      const cityValue = room.city || '';
      document.getElementById('selectedCity').value = cityValue;
      document.getElementById('citySearch').value = cityValue;
      document.getElementById('citySearch').placeholder = t('searchCity');
      
      document.getElementById('area').value = room.area || '';
      document.getElementById('distance').value = room.distance || '';
      document.getElementById('description').value = room.description || '';
      document.getElementById('features').value = (room.features || []).join(', ');
      document.getElementById('phone').value = room.phone || '';
      
      displayExistingImages();
      initSearchableDropdown();
      document.getElementById('loadingArea').style.display = 'none';
      document.getElementById('roomForm').style.display = 'block';
      updatePageLanguage();
    })();
    
    let coverKey = null; // either an existing image URL, or `new:<filename>` for a not-yet-uploaded file
    
    function displayExistingImages() {
      const container = document.getElementById('existingImagesContainer');
      if (imagesToKeep.length === 0) { 
        container.innerHTML = '<p class="text-slate-400 text-sm">' + t('noImages') + '</p>'; 
        return; 
      }
      container.innerHTML = imagesToKeep.map((img, idx) => {
        const isCover = coverKey === img;
        return `<div class="existing-image relative inline-block">
          <img src="${img}" class="preview-image${isCover ? ' is-cover' : ''}">
          <div class="remove-image" onclick="removeExistingImage(${idx})">×</div>
          ${isCover
            ? `<div class="cover-badge">${t('coverBadge')}</div>`
            : `<div class="cover-star" title="Set as cover photo" onclick="setCoverExisting(${idx})">☆</div>`}
        </div>`;
      }).join('');
    }
    
    function removeExistingImage(idx) { 
      const removedUrl = imagesToKeep[idx];
      imagesToKeep.splice(idx, 1); 
      if (coverKey === removedUrl) resetCoverIfNeeded();
      displayExistingImages(); 
    }
    window.removeExistingImage = removeExistingImage;
    
    function setCoverExisting(idx) {
      coverKey = imagesToKeep[idx];
      displayExistingImages();
      renderNewPreviews();
    }
    window.setCoverExisting = setCoverExisting;
    
    function resetCoverIfNeeded() {
      if (imagesToKeep.length > 0) { coverKey = imagesToKeep[0]; return; }
      if (newImages.length > 0) { coverKey = 'new:' + newImages[0].id; return; }
      coverKey = null;
    }
    
    // --- Image validation helpers -------------------------------------
    // 1) file.type must claim to be an image
    // 2) the file's actual bytes must match a known image signature
    //    (JPEG / PNG / WEBP), so a renamed .exe with a spoofed MIME type
    //    is still rejected.
    function hasImageMimeType(file) {
      return !!file.type && file.type.startsWith('image/');
    }

    function readFileHeaderHex(file, byteCount) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const bytes = new Uint8Array(ev.target.result);
          let hex = '';
          for (let i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
          resolve(hex);
        };
        reader.onerror = () => reject(new Error('Could not read file'));
        reader.readAsArrayBuffer(file.slice(0, byteCount));
      });
    }

    async function hasValidImageSignature(file) {
      try {
        const hex = await readFileHeaderHex(file, 12);
        const isJpeg = hex.startsWith('ffd8ff');
        const isPng = hex.startsWith('89504e470d0a1a0a');
        const isWebp = hex.startsWith('52494646') && hex.slice(16, 24) === '57454250';
        return isJpeg || isPng || isWebp;
      } catch {
        return false;
      }
    }

    async function isValidImageFile(file) {
      if (!hasImageMimeType(file)) return false;
      return hasValidImageSignature(file);
    }

    const newImagesInput = document.getElementById('newImagesInput');
    const newPreviewContainer = document.getElementById('newPreviewContainer');
    
    function renderNewPreviews() {
      newPreviewContainer.innerHTML = '';
      newImages.forEach(img => {
        const isCover = coverKey === ('new:' + img.id);
        const div = document.createElement('div'); div.className = 'relative inline-block'; div.id = `new-preview-${img.id}`;
        div.innerHTML = `<img src="${img.url}" class="preview-image${isCover ? ' is-cover' : ''}">
          <div class="remove-image" onclick="removeNewFile('${img.id}')">×</div>
          ${isCover
            ? `<div class="cover-badge">${t('coverBadge')}</div>`
            : `<div class="cover-star" title="Set as cover photo" onclick="setCoverNew('${img.id}')">☆</div>`}`;
        newPreviewContainer.appendChild(div);
      });
    }
    
    newImagesInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      const total = imagesToKeep.length + newImages.length + files.length;
      if (total > 10) { alert('Max 10 images total'); newImagesInput.value = ''; return; }
      for (const file of files) {
        if (file.size > 32*1024*1024) { alert(`${file.name} > 32MB`); continue; }
        const ok = await isValidImageFile(file);
        if (!ok) { alert(`${file.name} is not a valid image file.`); continue; }
        const id = crypto.randomUUID();
        newImages.push({ id, file, url: URL.createObjectURL(file) });
        if (!coverKey) coverKey = 'new:' + id;
      }
      renderNewPreviews();
      newImagesInput.value = '';
    });
    
    function removeNewFile(id) {
      const removed = newImages.find(img => img.id === id);
      if (removed) URL.revokeObjectURL(removed.url);
      newImages = newImages.filter(img => img.id !== id);
      if (coverKey === ('new:' + id)) resetCoverIfNeeded();
      renderNewPreviews();
      displayExistingImages();
    }
    window.removeNewFile = removeNewFile;
    
    function setCoverNew(id) {
      coverKey = 'new:' + id;
      displayExistingImages();
      renderNewPreviews();
    }
    window.setCoverNew = setCoverNew;
    
    async function uploadNewImages() {
      // Returns a Map of id -> uploaded public URL, keyed by id (not
      // filename) so two files with the same name never collide.
      const urlsById = new Map();
      for (const img of newImages) {
        const wrapper = document.getElementById(`new-preview-${img.id}`);
        setImageUploadStatus(wrapper, 'uploading');
        const ext = img.file.name.split('.').pop();
        const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
        const { error } = await sb.storage.from('room-images').upload(path, img.file);
        if (error) { setImageUploadStatus(wrapper, 'error'); throw new Error(t('errorOccurred') + 'Upload failed'); }
        const { data } = sb.storage.from('room-images').getPublicUrl(path);
        urlsById.set(img.id, data.publicUrl);
        setImageUploadStatus(wrapper, 'done');
      }
      return urlsById;
    }
    
    document.getElementById('roomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgDiv = document.getElementById('messageArea');
      const saveBtn = document.getElementById('saveChangesBtn');
      msgDiv.classList.add('hidden');
      setButtonLoading(saveBtn, true, t('savingChanges') || 'Saving changes...');
      try {
        const newUrlsById = await uploadNewImages();
        // Build the combined list, then float the chosen cover photo to index 0 —
        // that's what index.html/listings.html show on the room card.
        const combined = [
          ...imagesToKeep.map(url => ({ key: url, url })),
          ...newImages.map(img => ({ key: 'new:' + img.id, url: newUrlsById.get(img.id) }))
        ];
        const coverIdx = combined.findIndex(c => c.key === coverKey);
        const ordered = coverIdx > 0
          ? [combined[coverIdx], ...combined.filter((_, i) => i !== coverIdx)]
          : combined;
        const allImages = ordered.map(c => c.url);
        
        const pricingType = document.getElementById('pricingType').value;
        const monthlyPrice = parseInt(document.getElementById('monthlyPrice').value) || 0;
        const yearlyPrice = parseInt(document.getElementById('yearlyPrice').value) || 0;
        const selectedCity = document.getElementById('selectedCity').value;
        
        if (!selectedCity) { throw new Error(t('cityLabel2')); }
        
        const phoneCheck = validateCameroonPhone(document.getElementById('phone').value);
        if (!phoneCheck.isValid) { throw new Error(t('invalidPhone')); }
        
        const { error: updateError } = await sb.from('rooms').update({
          title: document.getElementById('title').value,
          pricing_type: pricingType,
          monthly_price: monthlyPrice,
          yearly_price: yearlyPrice,
          price: pricingType === 'monthly' ? monthlyPrice : (pricingType === 'yearly' ? yearlyPrice : monthlyPrice),
          city: selectedCity,
          area: document.getElementById('area').value || null,
          distance: parseFloat(document.getElementById('distance').value),
          description: document.getElementById('description').value,
          features: document.getElementById('features').value.split(',').map(f=>f.trim()).filter(f=>f),
          phone: phoneCheck.normalized,
          images: allImages.slice(0,10),
          status: 'pending'
        }).eq('id', roomId);
        if (updateError) throw updateError;
        msgDiv.classList.remove('hidden');
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-green-500/20 text-green-400';
        msgDiv.innerHTML = t('successUpdated') + ' ' + (t('pendingReviewNotice') || 'Your changes will be reviewed by admin before going live.');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2200);
      } catch (error) {
        msgDiv.classList.remove('hidden');
        msgDiv.className = 'mb-4 p-3 rounded-lg bg-red-500/20 text-red-400';
        msgDiv.innerHTML = t('errorOccurred') + error.message;
        setButtonLoading(saveBtn, false);
      }
    });
    
    document.getElementById('deleteBtn').onclick = async () => {
      if (confirm(t('confirm') + '? ' + t('deleteRoom'))) { 
        const deleteBtn = document.getElementById('deleteBtn');
        setButtonLoading(deleteBtn, true, t('deleting') || 'Deleting...');
        const { error } = await sb.rpc('delete_room', { room_id: roomId });
        if (error) { alert(error.message); setButtonLoading(deleteBtn, false); return; }
        window.location.href = 'dashboard.html'; 
      }
    };
  </script>
