  <style>
    .bg-primary { background-color: #22C55E; }
    .bg-whatsapp { background-color: #25D366; }
    .bg-whatsapp:hover { background-color: #1da851; }

    /* === Photo carousel (larger frame, no cropping, tap to enlarge) === */
    .carousel-wrap {
      position: relative;
      width: 100%;
      height: min(65vh, 460px);
      min-height: 280px;
      overflow: hidden;
      background: #0F172A;
    }
    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .carousel-slide {
      position: relative;
      flex: 0 0 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
    }
    /* Blurred, scaled copy of the same photo fills the frame edge-to-edge
       behind the real image, so there's never an empty letterbox bar —
       while the real image on top is never cropped (object-fit: contain). */
    .carousel-slide .carousel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.55);
      transform: scale(1.15);
    }
    .carousel-slide img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: zoom-in;
      user-select: none;
    }
    .carousel-zoom-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 5;
      background: rgba(15,23,42,0.7);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
    }
    .carousel-btns {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 5;
    }
    .carousel-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(15,23,42,0.7);
      border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 18px;
      user-select: none;
      transition: background-color 0.15s;
    }
    .carousel-btn:active { background: #22C55E; }
    .carousel-dots {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }
    .carousel-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: background-color 0.2s, transform 0.2s;
    }
    .carousel-dot.active { background: #22C55E; transform: scale(1.3); }

    /* === Lightbox (full-screen tap-to-enlarge view) === */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.95);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      user-select: none;
    }
    .lightbox-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid #fff;
      color: #fff;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid #fff;
      color: #fff;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #CBD5E1;
      font-size: 13px;
      background: rgba(255,255,255,0.08);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .feature-badge { background-color: #E5E7EB; color: #111827; }

    /* Navbar stays dark with white text in both modes */

    /* Price card styles */
    .price-card {
      background: linear-gradient(135deg, #22C55E10 0%, #22C55E05 100%);
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 3px solid #22C55E;
    }
    .price-yearly-card {
      background: linear-gradient(135deg, #3B82F610 0%, #3B82F605 100%);
      border-radius: 12px;
      padding: 12px 16px;
      border-left: 3px solid #3B82F6;
    }

  </style>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="roomContent" class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700"><div class="text-center py-20 text-slate-300" data-i18n="loadingText">Loading...</div></div>
    <div class="mt-4 flex gap-3">

      <div id="editButtonContainer"></div>
    </div>
  </div>

  <!-- Lightbox: full-screen tap-to-enlarge photo view -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-close" id="lightboxClose">✕</div>
    <div class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</div>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-nav lightbox-next" id="lightboxNext">›</div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <script>
    // Helper function to format price display based on pricing type (with translations)
    // Price math + number formatting live in js/shared.js (getRoomPricing/formatFCFA);
    // this function only owns this page's markup.
    function formatPriceDisplay(room) {
      const { pricingType, monthlyPrice, yearlyPrice, yearlyEquivalent, savings } = getRoomPricing(room);
      
      if (pricingType === 'yearly') {
        return `
          <div class="price-yearly-card mb-2">
            <div class="text-3xl font-bold text-blue-400">${formatFCFA(yearlyPrice)}</div>
            <div class="text-slate-400 text-sm">${t('yearlyPrice')}</div>
            <div class="text-slate-500 text-xs mt-1">💡 ${t('yearlyNote')}</div>
          </div>
        `;
      } 
      else if (pricingType === 'both') {
        const savingsText = savings > 0 ? `<span class="text-green-400 text-sm ml-2">(${t('saveAmount')} ${formatFCFA(savings)}!)</span>` : '';
        
        return `
          <div class="price-card mb-3">
            <div class="text-2xl font-bold text-primary">${formatFCFA(monthlyPrice)}</div>
            <div class="text-slate-400 text-sm">${t('bothMonthly')}</div>
          </div>
          <div class="price-yearly-card">
            <div class="text-2xl font-bold text-blue-400">${formatFCFA(yearlyPrice)} ${savingsText}</div>
            <div class="text-slate-400 text-sm">${t('bothYearly')}</div>
            <div class="text-slate-500 text-xs mt-1">💰 ${t('bothSavings')}</div>
          </div>
        `;
      }
      else { // monthly (default)
        return `
          <div class="price-card mb-2">
            <div class="text-3xl font-bold text-primary">${formatFCFA(monthlyPrice)}</div>
            <div class="text-slate-400 text-sm">${t('monthlyPrice')}</div>
            <div class="text-slate-500 text-xs mt-1">≈ ${formatFCFA(yearlyEquivalent)} ${t('yearlyPrice')}</div>
          </div>
        `;
      }
    }

    // Language Toggle Buttons
    const langToggle = document.getElementById('languageToggle');
    const mobileLangToggle = document.getElementById('mobileLanguageToggle');
    
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        // Reload room data after language change
        loadRoomData();
      });
    }
    if (mobileLangToggle) {
      mobileLangToggle.addEventListener('click', () => {
        toggleLanguage();
        loadRoomData();
      });
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    if (!roomId) document.getElementById('roomContent').innerHTML = '<div class="p-8 text-center text-red-400">No room ID</div>';
    
    let room = null;

    // Lightbox (tap-to-enlarge). Lives outside #roomContent so it's wired
    // up once and keeps working across every loadRoomData() re-render.
    let lightboxPhotos = [];
    let lightboxIndex = 0;
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');

    function updateLightboxImage() {
      lightboxImg.src = lightboxPhotos[lightboxIndex];
      lightboxCounter.textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
    }
    function openLightbox(index) {
      if (!lightboxPhotos.length) return;
      lightboxIndex = index;
      updateLightboxImage();
      lightboxOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightboxOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    function lightboxPrev() {
      lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
      updateLightboxImage();
    }
    function lightboxNext() {
      lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
      updateLightboxImage();
    }
    document.getElementById('lightboxClose').onclick = closeLightbox;
    document.getElementById('lightboxPrev').onclick = lightboxPrev;
    document.getElementById('lightboxNext').onclick = lightboxNext;
    // Click the dark backdrop (not the photo itself) to close
    lightboxOverlay.addEventListener('click', (e) => { if (e.target === lightboxOverlay) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightboxOverlay.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') lightboxPrev();
      else if (e.key === 'ArrowRight') lightboxNext();
    });
    
    async function loadRoomData() {
      if (!roomId) return;
      
      const nowIso = new Date().toISOString();
      const { data: r, error } = await withTimeout(
        sb.from('rooms')
          .select('*, profiles:landlord_id(full_name)')
          .eq('id', roomId)
          .eq('status', 'approved')
          .or(`expires_at.gt.${nowIso},expires_at.is.null`)
          .maybeSingle(),
        10000,
        'Room fetch'
      );
      if (error || !r) { 
        document.getElementById('roomContent').innerHTML = '<div class="p-8 text-center text-red-400">Listing not available</div>'; 
        // This room doesn't exist / isn't approved / has expired — tell search
        // engines not to index this specific URL instead of leaving the
        // generic fallback tags in place.
        const robotsTag = document.getElementById('robotsTag');
        if (robotsTag) robotsTag.setAttribute('content', 'noindex');
        return; 
      }
      room = {
        title: r.title, city: r.city, area: r.area, distance: r.distance, description: r.description,
        features: r.features, images: r.images, phone: r.phone, landlordId: r.landlord_id,
        landlordName: r.profiles?.full_name || null,
        pricingType: r.pricing_type, monthlyPrice: r.monthly_price, yearlyPrice: r.yearly_price, price: r.price
      };
      
      // --- SEO: give this specific room its own title, description, and
      // structured data instead of the generic "Room Details" placeholder.
      // This is what lets an individual listing show up in Google results
      // and look good when shared on WhatsApp/Facebook.
      const seoPricing = getRoomPricing(room);
      const seoPriceText = seoPricing.pricingType === 'yearly'
        ? `${formatFCFA(seoPricing.yearlyPrice)}/year`
        : `${formatFCFA(seoPricing.monthlyPrice)}/month`;
      const seoTitle = `${room.title} — ${room.city} | ${seoPriceText} | StudentStay`;
      const seoDescription = `${room.title} in ${room.city}${room.area ? ', ' + room.area : ''}. ${seoPriceText}. ${(room.description || '').slice(0, 120)}`.trim();
      const seoUrl = `https://studentstay-cm.vercel.app/details.html?id=${roomId}`;
      const seoImage = (room.images && room.images[0]) || 'https://studentstay-cm.vercel.app/icons/icon-512.png';

      document.title = seoTitle;
      document.querySelector('meta[name="description"]')?.setAttribute('content', seoDescription);
      document.getElementById('canonicalTag')?.setAttribute('href', seoUrl);
      document.getElementById('ogTitle')?.setAttribute('content', seoTitle);
      document.getElementById('ogDescription')?.setAttribute('content', seoDescription);
      document.getElementById('ogUrl')?.setAttribute('content', seoUrl);
      document.getElementById('ogImage')?.setAttribute('content', seoImage);

      const jsonLd = document.createElement('script');
      jsonLd.type = 'application/ld+json';
      jsonLd.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Product",
        "name": room.title,
        "description": room.description || seoDescription,
        "image": room.images || [],
        "offers": {
          "@type": "Offer",
          "url": seoUrl,
          "priceCurrency": "XAF",
          "price": seoPricing.pricingType === 'yearly' ? seoPricing.yearlyPrice : seoPricing.monthlyPrice,
          "availability": "https://schema.org/InStock"
        }
      });
      document.head.appendChild(jsonLd);

      // Get the display price for WhatsApp message
      const roomPricing = getRoomPricing(room);
      const displayPrice = roomPricing.pricingType === 'yearly' 
        ? `${formatFCFA(roomPricing.yearlyPrice)} ${t('yearlyPrice')}`
        : (roomPricing.pricingType === 'both'
          ? `${formatFCFA(roomPricing.monthlyPrice)}/${t('monthlyPrice')} or ${formatFCFA(roomPricing.yearlyPrice)}/${t('yearlyPrice')}`
          : `${formatFCFA(roomPricing.monthlyPrice)}/${t('monthlyPrice')}`);
      
      const msg = encodeURIComponent(`Hello, I saw your ${room.title} on StudentStay for ${displayPrice} and I am interested.`);
      const whatsappUrl = `https://wa.me/237${(room.phone || '').replace(/[^0-9]/g, '')}?text=${msg}`;
      
      const photos = room.images || [];
      let imagesHtml;
      if (photos.length === 0) {
        imagesHtml = '<div class="w-full h-80 bg-slate-700 flex items-center justify-center text-slate-400">📷 No images</div>';
      } else if (photos.length === 1) {
        imagesHtml = `
        <div class="carousel-wrap">
          <div class="carousel-bg" style="background-image:url('${photos[0]}')"></div>
          <img src="${photos[0]}" alt="Photo 1" onclick="openLightbox(0)">
          <div class="carousel-zoom-hint">🔍 Tap to enlarge</div>
        </div>`;
      } else {
        imagesHtml = `
        <div class="carousel-wrap">
          <div class="carousel-dots" id="carouselDots">
            ${photos.map((_, i) => `<div class="carousel-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></div>`).join('')}
          </div>
          <div class="carousel-track" id="carouselTrack">
            ${photos.map((img, i) => `
              <div class="carousel-slide">
                <div class="carousel-bg" style="background-image:url('${img}')"></div>
                <img src="${img}" alt="Photo ${i + 1}" onclick="openLightbox(${i})">
              </div>`).join('')}
          </div>
          <div class="carousel-zoom-hint">🔍 Tap to enlarge</div>
          <div class="carousel-btns">
            <div class="carousel-btn" id="carouselPrev">‹</div>
            <div class="carousel-btn" id="carouselNext">›</div>
          </div>
        </div>`;
      }
      
      const pricingHtml = formatPriceDisplay(room);
      
      document.getElementById('roomContent').innerHTML = `
        <div>
          <div>${imagesHtml}</div>
          <div class="p-6">
            <div class="flex justify-between items-start flex-wrap gap-2 mb-4">
              <h1 class="text-2xl font-bold text-white">${escapeHtml(room.title)}</h1>
              <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm font-semibold">✅ ${t('verified')}</span>
            </div>
            
            <div class="mb-4">
              ${pricingHtml}
            </div>
            
            <div class="flex items-center gap-2 text-slate-300 mb-4">
              <span>📍</span>
              <span>${escapeHtml(room.city)}${room.area ? `, ${escapeHtml(room.area)}` : ''}</span>
              <span>•</span>
              <span>🚶 ${room.distance || '?'} km ${t('fromUni')}</span>
            </div>

            ${room.landlordName ? `
            <div class="text-sm text-slate-400 mb-4">
              ${t('postedBy') || 'Posted by'} <a href="agent.html?id=${room.landlordId}" class="text-primary hover:underline">${escapeHtml(room.landlordName)}</a>
              <span class="mx-1">·</span>
              <a href="agent.html?id=${room.landlordId}" class="text-primary hover:underline">${t('seeAllRoomsFrom') || 'See all their rooms'}</a>
            </div>
            ` : ''}
            
            <div class="flex flex-wrap gap-2 mb-4">
              ${room.features ? room.features.map(f => `<span class="bg-slate-700 text-slate-200 px-3 py-1 rounded-full text-sm">${escapeHtml(f)}</span>`).join('') : ''}
            </div>
            
            <div class="border-t border-slate-700 pt-4">
              <h3 class="font-semibold text-white mb-2" data-i18n="description">Description</h3>
              <p class="text-slate-300 leading-relaxed">${escapeHtml(room.description || 'No description provided')}</p>
            </div>
            
            <div class="border-t border-slate-700 pt-4 mt-4 flex flex-wrap gap-3">
              <a href="${whatsappUrl}" target="_blank" class="bg-whatsapp text-white text-center py-3 px-6 rounded-full font-semibold inline-flex items-center gap-2 w-full sm:w-auto justify-center transition">
                📲 ${t('contactWhatsApp')}
              </a>
              <button id="shareRoomBtn" class="bg-slate-700 text-white text-center py-3 px-6 rounded-full font-semibold inline-flex items-center gap-2 w-full sm:w-auto justify-center transition hover:bg-slate-600">
                🔗 <span id="shareRoomBtnLabel">${t('shareRoom') || 'Share this room'}</span>
              </button>
            </div>
          </div>
        </div>
      `;

      // --- Share button ---
      // On phones this opens the native share sheet, which includes
      // "WhatsApp" and "WhatsApp Status" directly if the app is installed —
      // exactly what landlords/agents want for pushing a room into a group
      // or their status. On desktop (no native share sheet available) it
      // falls back to copying the link so they can paste it anywhere.
      const shareBtn = document.getElementById('shareRoomBtn');
      const shareBtnLabel = document.getElementById('shareRoomBtnLabel');
      if (shareBtn) {
        shareBtn.onclick = async () => {
          const shareData = {
            title: seoTitle,
            text: `${room.title} — ${room.city}, ${seoPriceText}`,
            url: seoUrl
          };
          if (navigator.share) {
            try {
              await navigator.share(shareData);
            } catch (err) {
              // User cancelled the share sheet — not an error, do nothing.
            }
          } else {
            try {
              await navigator.clipboard.writeText(seoUrl);
              const original = shareBtnLabel.textContent;
              shareBtnLabel.textContent = t('linkCopied') || 'Link copied!';
              setTimeout(() => { shareBtnLabel.textContent = original; }, 2000);
            } catch (err) {
              // Clipboard API blocked (rare, e.g. insecure context) — last
              // resort: open a WhatsApp share link directly.
              window.open(`https://wa.me/?text=${encodeURIComponent(shareData.text + ' ' + shareData.url)}`, '_blank');
            }
          }
        };
      }
      
      // Apply translations to dynamic content
      updatePageLanguage();
      
      // Wire up the photo carousel (only present when there are 2+ photos).
      // Simple slide track: translateX the track by 100% per step, one
      // photo fills the viewport at a time. Supports buttons, dots, and
      // touch/mouse drag swiping.
      const carouselTrack = document.getElementById('carouselTrack');
      if (carouselTrack) {
        let currentIndex = 0;
        const dots = document.querySelectorAll('#carouselDots .carousel-dot');

        function updateCarousel() {
          carouselTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
          dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
          lightboxIndex = currentIndex;
        }

        document.getElementById('carouselPrev').onclick = () => {
          currentIndex = (currentIndex - 1 + photos.length) % photos.length;
          updateCarousel();
        };
        document.getElementById('carouselNext').onclick = () => {
          currentIndex = (currentIndex + 1) % photos.length;
          updateCarousel();
        };
        dots.forEach(dot => {
          dot.onclick = () => { currentIndex = parseInt(dot.dataset.idx); updateCarousel(); };
        });

        // Touch/mouse drag swipe
        let dragStartX = null, dragDeltaX = 0, dragging = false;
        const wrap = carouselTrack.closest('.carousel-wrap');
        const onDragStart = (x) => { dragging = true; dragStartX = x; carouselTrack.style.transition = 'none'; };
        const onDragMove = (x) => {
          if (!dragging) return;
          dragDeltaX = x - dragStartX;
          carouselTrack.style.transform = `translateX(calc(-${currentIndex * 100}% + ${dragDeltaX}px))`;
        };
        const onDragEnd = () => {
          if (!dragging) return;
          dragging = false;
          carouselTrack.style.transition = '';
          const threshold = wrap.offsetWidth * 0.15;
          if (dragDeltaX > threshold) currentIndex = (currentIndex - 1 + photos.length) % photos.length;
          else if (dragDeltaX < -threshold) currentIndex = (currentIndex + 1) % photos.length;
          dragDeltaX = 0;
          updateCarousel();
        };
        wrap.addEventListener('touchstart', e => onDragStart(e.touches[0].clientX), { passive: true });
        wrap.addEventListener('touchmove', e => onDragMove(e.touches[0].clientX), { passive: true });
        wrap.addEventListener('touchend', onDragEnd);
        wrap.addEventListener('mousedown', e => { e.preventDefault(); onDragStart(e.clientX); });
        // Window-level listeners get re-created on every loadRoomData() call
        // (e.g. after a language switch) — remove the previous pair first so
        // they don't pile up across reloads.
        if (window._carouselMouseMove) window.removeEventListener('mousemove', window._carouselMouseMove);
        if (window._carouselMouseUp) window.removeEventListener('mouseup', window._carouselMouseUp);
        window._carouselMouseMove = (e) => onDragMove(e.clientX);
        window._carouselMouseUp = onDragEnd;
        window.addEventListener('mousemove', window._carouselMouseMove);
        window.addEventListener('mouseup', window._carouselMouseUp);

        updateCarousel();
      }

      // Lightbox (tap-to-enlarge full-screen view)
      lightboxPhotos = photos;
      lightboxIndex = 0;
      
      // currentUser is kept up to date by the onAuthStateChange subscriber in
      // js/supabase-config.js — reusing it here avoids yet another getSession()
      // call competing for the same session lock.
      const user = currentUser;
      let isOwner = false;
      let isAdmin = false;
      if (user) {
        const { data: profileRow } = await sb.from('profiles').select('role').eq('id', user.id).single();
        isOwner = room.landlordId === user.id;
        isAdmin = profileRow?.role === 'admin';
      }
      if (isOwner || isAdmin) {
        // Note: this button being hidden/shown is a display convenience only.
        // The actual protection against unauthorized edits lives in the
        // Supabase Row Level Security policy on the rooms table — a hidden
        // button alone would never stop someone bypassing the UI.
        document.getElementById('editButtonContainer').innerHTML = `<a href="edit-room.html?id=${roomId}" class="bg-yellow-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-yellow-700 inline-block transition">✏️ ${t('editRoom')}</a>`;
      } else if (room.landlordId) {
        document.getElementById('editButtonContainer').innerHTML = `<a href="agent.html?id=${room.landlordId}" class="bg-slate-700 text-white px-4 py-2 rounded-lg font-semibold hover:bg-slate-600 inline-block transition">👤 ${t('viewOwnerProfile') || 'View room owner profile'}</a>`;
      }
    }
    
    // Listen for language changes
    window.addEventListener('languageChanged', () => {
      if (room) {
        loadRoomData();
      }
    });
    
    function updateAuthButtons(user) {
      const desktopLogout = document.getElementById('desktopLogoutBtn');
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (user) {
        if (desktopLogout) { desktopLogout.textContent = t('logout'); desktopLogout.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; }
        if (mobileLogout) { mobileLogout.textContent = t('logout'); mobileLogout.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; }
      } else {
        if (desktopLogout) { desktopLogout.textContent = t('login'); desktopLogout.href = 'login.html'; desktopLogout.onclick = null; }
        if (mobileLogout) { mobileLogout.textContent = t('login'); mobileLogout.href = 'login.html'; mobileLogout.onclick = null; }
      }
    }
    // onAuthStateChange fires once immediately with the current session on
    // subscribe — no separate getSession() call needed here.
    let initialRoomLoadDone = false;
    sb.auth.onAuthStateChange((_event, session) => {
      updateAuthButtons(session?.user ?? null);
      if (!initialRoomLoadDone) {
        initialRoomLoadDone = true;
        loadRoomData();
      }
    });
    
    // Simple escape function to prevent XSS
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
