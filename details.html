<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Details - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .bg-whatsapp { background-color: #25D366; }
    .bg-whatsapp:hover { background-color: #1da851; }
    .nav-btn {
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s;
      font-weight: 500;
    }
    .nav-btn:hover {
      background-color: #22C55E;
      color: white !important;
    }

    /* === DARK MODE (default) === */
    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }

    /* === LIGHT MODE === */
    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .text-white { color: #111827; }
    body.light-mode .text-slate-300 { color: #374151; }
    body.light-mode .text-slate-400 { color: #4B5563; }
    body.light-mode .bg-green-500\/20 { background-color: #D1FAE5 !important; }
    body.light-mode .text-green-400 { color: #059669 !important; }
    body.light-mode .feature-badge { background-color: #E5E7EB; color: #111827; }

    /* Navbar stays dark with white text in both modes */
    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav p,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }
    body.light-mode #mobileMenu {
      background-color: #1E293B !important;
    }
    body.light-mode #mobileMenu a,
    body.light-mode #mobileMenu button {
      color: #FFFFFF !important;
    }
  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">StudentStay</h1>
          <p class="text-xs text-slate-300">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary">Home</a>
        <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary">Browse</a>
        <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary">Dashboard</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary">🌓 Dark/Light</button>
        <a href="#" id="desktopLogoutBtn" class="nav-btn text-slate-300 hover:text-primary">Login</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left">Home</a>
      <a href="listings.html" class="nav-btn text-slate-300 hover:text-primary block text-left">Browse</a>
      <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary block text-left">Dashboard</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌓 Dark/Light</button>
      <a href="#" id="mobileLogoutBtn" class="nav-btn text-slate-300 hover:text-primary block text-left">Login</a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="roomContent" class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700"><div class="text-center py-20 text-slate-300">Loading...</div></div>
    <div class="mt-4 flex gap-3"><a href="listings.html" class="inline-block text-primary hover:underline">← Back to listings</a><div id="editButtonContainer"></div></div>
  </div>

  <script>
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });
    document.getElementById('mobileDarkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    if (!roomId) document.getElementById('roomContent').innerHTML = '<div class="p-8 text-center text-red-400">No room ID</div>';
    
    let room = null;
    firebase.auth().onAuthStateChanged(async (user) => {
      const desktopLogout = document.getElementById('desktopLogoutBtn');
      const mobileLogout = document.getElementById('mobileLogoutBtn');
      if (user) {
        if (desktopLogout) { desktopLogout.textContent = 'Logout'; desktopLogout.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
        if (mobileLogout) { mobileLogout.textContent = 'Logout'; mobileLogout.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
      } else {
        if (desktopLogout) { desktopLogout.textContent = 'Login'; desktopLogout.href = 'login.html'; desktopLogout.onclick = null; }
        if (mobileLogout) { mobileLogout.textContent = 'Login'; mobileLogout.href = 'login.html'; mobileLogout.onclick = null; }
      }

      const doc = await db.collection('rooms').doc(roomId).get();
      if (!doc.exists) { document.getElementById('roomContent').innerHTML = '<div class="p-8 text-center text-red-400">Room not found</div>'; return; }
      room = doc.data();
      const msg = encodeURIComponent(`Hello, I saw your ${room.title} on StudentStay for ${room.price?.toLocaleString()} FCFA and I am interested.`);
      const whatsappUrl = `https://wa.me/237${(room.phone || '').replace(/[^0-9]/g, '')}?text=${msg}`;
      const imagesHtml = room.images && room.images.length ? room.images.map(img => `<img src="${img}" class="w-full h-80 object-cover">`).join('') : '<div class="w-full h-80 bg-slate-700 flex items-center justify-center text-slate-400">📷 No images</div>';
      document.getElementById('roomContent').innerHTML = `<div><div class="flex overflow-x-auto snap-x snap-mandatory">${imagesHtml}</div><div class="p-6"><div class="flex justify-between items-start flex-wrap gap-2 mb-4"><h1 class="text-2xl font-bold text-white">${room.title}</h1><span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm font-semibold">✅ Verified</span></div><div class="text-primary font-bold text-3xl mb-2">${room.price?.toLocaleString() || 0} FCFA<span class="text-slate-300 text-base font-normal">/month</span></div><div class="flex items-center gap-2 text-slate-300 mb-4"><span>📍</span><span>${room.city}${room.area ? `, ${room.area}` : ''}</span><span>•</span><span>🚶 ${room.distance} km from University</span></div><div class="flex flex-wrap gap-2 mb-4">${room.features ? room.features.map(f => `<span class="bg-slate-700 text-slate-200 px-3 py-1 rounded-full text-sm">${f}</span>`).join('') : ''}</div><div class="border-t border-slate-700 pt-4"><h3 class="font-semibold text-white mb-2">Description</h3><p class="text-slate-300 leading-relaxed">${room.description || 'No description provided'}</p></div><div class="border-t border-slate-700 pt-4 mt-4"><a href="${whatsappUrl}" target="_blank" class="bg-whatsapp text-white text-center py-3 px-6 rounded-full font-semibold inline-flex items-center gap-2 w-full sm:w-auto justify-center transition">📲 Contact Landlord on WhatsApp</a></div></div></div>`;
      
      if (user) {
        const userDoc = await db.collection('users').doc(user.uid).get();
        const userData = userDoc.data();
        const isOwner = room.landlordId === user.uid;
        const isAdmin = userData?.role === 'admin';
        if (isOwner || isAdmin) {
          document.getElementById('editButtonContainer').innerHTML = `<a href="edit-room.html?id=${roomId}" class="bg-yellow-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-yellow-700 inline-block transition">✏️ Edit Room</a>`;
        }
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
</body>
</html>
