<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Rooms - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/shared.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .card { background-color: #1E293B; border-radius: 16px; overflow: hidden; border: 1px solid #334155; transition: all 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .feature-badge { background-color: #334155; color: #CBD5E1; padding: 4px 8px; border-radius: 8px; font-size: 12px; }

    /* Searchable dropdown styles */
    .searchable-dropdown {
      position: relative;
      width: 100%;
    }
    .dropdown-input {
      width: 100%;
      background-color: #334155;
      border: 1px solid #475569;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background-color: #1E293B;
      border: 1px solid #475569;
      border-radius: 8px;
      z-index: 10;
      display: none;
    }
    .dropdown-list.show { display: block; }
    .dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
      color: #CBD5E1;
    }
    .dropdown-item:hover { background-color: #22C55E; color: white; }

    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }
    body .card { background-color: #1E293B; border-color: #334155; }
    body .feature-badge { background-color: #334155; color: #CBD5E1; }
    body footer { background-color: #0F172A; border-color: #1E293B; }
    body footer .text-slate-400 { color: #94A3B8; }

    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .card { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .card .text-white { color: #111827; }
    body.light-mode .card .text-slate-300 { color: #374151; }
    body.light-mode .card .text-slate-400 { color: #4B5563; }
    body.light-mode .feature-badge { background-color: #E5E7EB; color: #111827; }
    body.light-mode .btn-primary { background-color: #22C55E; color: white; }
    body.light-mode .btn-primary:hover { background-color: #16A34A; }
    body.light-mode .bg-primary { background-color: #22C55E; }
    body.light-mode .text-primary { color: #22C55E; }
    body.light-mode .dropdown-list { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .dropdown-item { color: #374151; }
    body.light-mode .dropdown-input { background-color: #F3F4F6; border-color: #E5E7EB; color: #111827; }
    
    body.light-mode footer {
      background-color: #F9FAFB !important;
      border-color: #E5E7EB !important;
    }
    body.light-mode footer .text-slate-400 {
      color: #4B5563 !important;
    }

    body.light-mode select,
    body.light-mode input {
      background-color: #FFFFFF !important;
      border-color: #D1D5DB !important;
      color: #111827 !important;
    }
    body.light-mode select option {
      background-color: #FFFFFF !important;
      color: #111827 !important;
    }

    body.light-mode h1.text-white,
    body.light-mode .text-slate-300:not(nav .text-slate-300),
    body.light-mode .text-slate-400 {
      color: #111827 !important;
    }


  </style>
</head>
<body>

    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-base">S</span></div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight" data-i18n="appName">StudentStay</h1>
          <p class="text-xs text-slate-300" data-i18n="tagline">Find Rooms. No Stress.</p>
        </div>
      </a>
      <div class="hidden md:flex gap-3">
        <a href="index.html" class="nav-btn text-white hover:text-primary" data-i18n="home">Home</a>
        <a href="listings.html" class="nav-btn text-primary hover:text-primary" data-i18n="browse">Browse</a>
        <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary" data-i18n="listRoom">List a Room</a>
        <button id="darkModeToggle" class="nav-btn text-slate-300 hover:text-primary" data-i18n="darkLight">🌓 Dark/Light</button>
        <button id="languageToggle" class="nav-btn text-slate-300 hover:text-primary">🌐 FR/EN</button>
        <a href="#" id="desktopLogoutBtn" class="nav-btn text-slate-300 hover:text-primary" data-i18n="login">Login</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-2">
      <a href="index.html" class="nav-btn text-white hover:text-primary block text-left" data-i18n="home">Home</a>
      <a href="listings.html" class="nav-btn text-primary hover:text-primary block text-left" data-i18n="browse">Browse</a>
      <a href="dashboard.html" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="listRoom">List a Room</a>
      <button id="mobileDarkModeToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full" data-i18n="darkLight">🌓 Dark/Light</button>
      <button id="mobileLanguageToggle" class="nav-btn text-slate-300 hover:text-primary text-left w-full">🌐 FR/EN</button>
      <a href="#" id="mobileLogoutBtn" class="nav-btn text-slate-300 hover:text-primary block text-left" data-i18n="login">Login</a>
    </div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-6" data-i18n="browseTitle">Browse Rooms</h1>
    
    <!-- FILTER SECTION -->
    <div class="bg-slate-800 rounded-xl p-4 mb-8 border border-slate-700">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
        
        <!-- City Filter with Search -->
        <div>
          <label class="block text-slate-400 text-xs mb-1" data-i18n="cityLabel">City / Town</label>
          <div class="searchable-dropdown">
            <input type="text" id="citySearch" placeholder="" class="dropdown-input" autocomplete="off" data-i18n-placeholder="searchCity">
            <div id="cityDropdownList" class="dropdown-list"></div>
          </div>
          <input type="hidden" id="selectedCityFilter">
        </div>
        
        <!-- Pricing Type Filter -->
        <div>
          <label class="block text-slate-400 text-xs mb-1" data-i18n="pricingTypeLabel">Pricing Type</label>
          <select id="pricingTypeFilter" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
            <option value="" data-i18n="allPricing">All</option>
            <option value="monthly" data-i18n="monthly">Monthly</option>
            <option value="yearly" data-i18n="yearly">Yearly (School Year)</option>
            <option value="both" data-i18n="both">Both Options</option>
          </select>
        </div>
        
        <!-- Min Price -->
        <div>
          <label class="block text-slate-400 text-xs mb-1" data-i18n="minPriceLabel">Min Price (FCFA)</label>
          <input type="number" id="minPrice" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 placeholder-slate-400" data-i18n-placeholder="minPricePlaceholder">
        </div>
        
        <!-- Max Price -->
        <div>
          <label class="block text-slate-400 text-xs mb-1" data-i18n="maxPriceLabel">Max Price (FCFA)</label>
          <input type="number" id="maxPrice" placeholder="" class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 placeholder-slate-400" data-i18n-placeholder="maxPricePlaceholder">
        </div>
        
        <!-- Apply Button -->
        <div class="flex items-end">
          <button id="applyFilters" class="w-full bg-primary text-white rounded-lg py-2 font-semibold hover:bg-green-600" data-i18n="applyFilters">Apply Filters</button>
        </div>
      </div>
      <div class="mt-3 flex justify-between items-center flex-wrap gap-2">
        <button id="resetFilters" class="text-sm text-slate-400 hover:text-primary" data-i18n="resetFilters">Reset all filters</button>
        <div id="activeFilters" class="flex flex-wrap gap-2"></div>
      </div>
    </div>
    
    <p id="resultsCount" class="text-slate-300 mb-4" data-i18n="loading">Loading...</p>
    <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div class="text-center mt-6">
      <button id="loadMoreBtn" class="bg-slate-700 hover:bg-primary text-white px-6 py-2 rounded-lg font-medium transition" style="display:none;" data-i18n="loadMore">Load More</button>
    </div>
  </div>

  <footer class="bg-slate-900 border-t border-slate-800 py-8 text-center text-slate-400 text-sm">
    <p><span class="text-primary font-bold" data-i18n="appName">StudentStay</span> — <span data-i18n="footerTagline">Find Rooms. No Stress.</span></p>
    <p class="mt-1" data-i18n="footerLocation">📍 All major university cities across Cameroon</p>
    <p class="mt-3 text-xs text-slate-600">
      <a href="https://asghinlabs.vercel.app" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: none; font-weight: 500;">a asghinlabs product</a>
    </p>
  </footer>

  <script>
    // Complete list of Cameroonian cities (all university zones)
    const CAMEROON_CITIES = [
      "Bamenda", "Bambili", "Mankon", "Nkwen", "Up Station", "Kumbo", "Ndop", "Fundong", "Bali", "Santa", "Wum",
      "Buea", "Limbe", "Kumba", "Tiko", "Muyuka", "Mamfe",
      "Douala", "Bonaberi", "Nkongsamba", "Edéa", "Loum", "Manjo",
      "Yaoundé", "Soa", "Mbalmayo", "Ebolowa", "Mfou", "Obala", "Ngoumou",
      "Dschang", "Bafoussam", "Bangangté", "Foumban", "Mbouda", "Bafang", "Bandjoun",
      "Ngaoundéré", "Tibati", "Meiganga", "Ngaoundal", "Banyo",
      "Maroua", "Mokolo", "Kousséri", "Yagoua", "Mora", "Kaélé",
      "Garoua", "Rey Bouba", "Lagdo", "Poli", "Tcholliré",
      "Bertoua", "Batouri", "Abong-Mbang", "Yokadouma", "Doumé",
      "Kribi", "Ambam", "Sangmélima"
    ].sort();

    // Initialize searchable dropdown for city filter
    function initCityDropdown() {
      const searchInput = document.getElementById('citySearch');
      const dropdownList = document.getElementById('cityDropdownList');
      const hiddenInput = document.getElementById('selectedCityFilter');
      
      function renderCities(filter = '') {
        const filtered = CAMEROON_CITIES.filter(city => 
          city.toLowerCase().includes(filter.toLowerCase())
        );
        if (filtered.length === 0) {
          dropdownList.innerHTML = '<div class="dropdown-item text-slate-500">' + t('noCitiesFound') + '</div>';
        } else {
          dropdownList.innerHTML = filtered.map(city => 
            `<div class="dropdown-item" data-city="${city}">${city}</div>`
          ).join('');
        }
        dropdownList.classList.add('show');
        
        document.querySelectorAll('.dropdown-item[data-city]').forEach(item => {
          item.addEventListener('click', () => {
            const city = item.dataset.city;
            searchInput.value = city;
            hiddenInput.value = city;
            dropdownList.classList.remove('show');
            applyFilters();
          });
        });
      }
      
      searchInput.addEventListener('input', (e) => renderCities(e.target.value));
      searchInput.addEventListener('focus', () => renderCities(searchInput.value));
      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) {
          dropdownList.classList.remove('show');
        }
      });
      
      renderCities('');
    }

    // Helper function to get display price for card (with translations)
    // Price math + number formatting live in js/shared.js (getRoomPricing/formatFCFA);
    // this function only owns this page's markup.
    function getCardPriceDisplay(room) {
      const { pricingType, monthlyPrice, yearlyPrice } = getRoomPricing(room);
      const perMonthText = t('perMonth');
      const perYearText = t('perYear');
      const yearlyOptionText = t('yearlyOption');
      
      if (pricingType === 'yearly') {
        return `<div class="text-green-400 font-bold text-2xl">${formatFCFA(yearlyPrice)}<span class="text-sm text-slate-300">${perYearText}</span></div>`;
      } 
      else if (pricingType === 'both') {
        return `<div class="text-green-400 font-bold text-xl">${formatFCFA(monthlyPrice)}<span class="text-sm text-slate-300">${perMonthText}</span></div>
                <div class="text-green-400/80 font-semibold text-sm">${yearlyOptionText}</div>`;
      }
      else {
        return `<div class="text-green-400 font-bold text-2xl">${formatFCFA(monthlyPrice)}<span class="text-sm text-slate-300">${perMonthText}</span></div>`;
      }
    }

    // Language Toggle Buttons
    const langToggle = document.getElementById('languageToggle');
    const mobileLangToggle = document.getElementById('mobileLanguageToggle');
    
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        toggleLanguage();
        // Update placeholder after language change
        const citySearch = document.getElementById('citySearch');
        if (citySearch) citySearch.placeholder = t('searchCity');
        displayRooms();
      });
    }
    if (mobileLangToggle) {
      mobileLangToggle.addEventListener('click', () => {
        toggleLanguage();
        const citySearch = document.getElementById('citySearch');
        if (citySearch) citySearch.placeholder = t('searchCity');
        displayRooms();
      });
    }

    function updateAuthButtons(user) {
      const desktopBtn = document.getElementById('desktopLogoutBtn'), mobileBtn = document.getElementById('mobileLogoutBtn');
      if (user) {
        if (desktopBtn) { desktopBtn.textContent = t('logout'); desktopBtn.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; }
        if (mobileBtn) { mobileBtn.textContent = t('logout'); mobileBtn.onclick = (e) => { e.preventDefault(); sb.auth.signOut().then(() => window.location.href = 'login.html'); }; }
      } else {
        if (desktopBtn) { desktopBtn.textContent = t('login'); desktopBtn.href = 'login.html'; desktopBtn.onclick = null; }
        if (mobileBtn) { mobileBtn.textContent = t('login'); mobileBtn.href = 'login.html'; mobileBtn.onclick = null; }
      }
    }
    // onAuthStateChange already fires immediately with the current session
    // on subscribe — the separate getSession() call here was redundant and
    // added to session-lock contention that could hang page load.
    sb.auth.onAuthStateChange((_event, session) => updateAuthButtons(session?.user ?? null));
    
    // Listen for language changes
    window.addEventListener('languageChanged', () => {
      displayRooms();
      updateAuthButtons(currentUser);
      // Update filter dropdown options text
      const pricingFilter = document.getElementById('pricingTypeFilter');
      if (pricingFilter) {
        pricingFilter.options[0].text = t('allPricing');
        pricingFilter.options[1].text = t('monthly');
        pricingFilter.options[2].text = t('yearly');
        pricingFilter.options[3].text = t('both');
      }
      // Update placeholders
      document.getElementById('citySearch').placeholder = t('searchCity');
      document.getElementById('minPrice').placeholder = t('minPricePlaceholder');
      document.getElementById('maxPrice').placeholder = t('maxPricePlaceholder');
    });
    
    let allRooms = [], filteredRooms = [];
    const PAGE_SIZE = 50;
    let pageOffset = 0;
    let hasMoreRooms = true;
    let isLoadingRooms = false;

    async function loadRooms(isLoadMore = false) {
      const grid = document.getElementById('roomsGrid');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (isLoadingRooms) return;
      isLoadingRooms = true;

      if (!isLoadMore) {
        pageOffset = 0;
        hasMoreRooms = true;
        allRooms = [];
        grid.innerHTML = getSkeletonCards(6);
      } else {
        setButtonLoading(loadMoreBtn, true, t('loading') || 'Loading...');
      }

      try {
        // .range() alone paginates to PAGE_SIZE rows (offset..offset+PAGE_SIZE-1);
        // calling .limit() as well would overwrite the same Range header, so only .range() is used here.
        const nowIso = new Date().toISOString();
        const { data, error } = await withTimeout(
          sb.from('rooms').select('*')
            .eq('status', 'approved')
            .or(`expires_at.gt.${nowIso},expires_at.is.null`)
            .order('id', { ascending: false })
            .range(pageOffset, pageOffset + PAGE_SIZE - 1),
          10000,
          'Room fetch'
        );
        if (error) throw error;

        const newRooms = (data || []).map(r => ({
          id: r.id, title: r.title, city: r.city, distance: r.distance,
          images: r.images, features: r.features,
          pricingType: r.pricing_type, monthlyPrice: r.monthly_price, yearlyPrice: r.yearly_price, price: r.price
        }));

        allRooms = isLoadMore ? [...allRooms, ...newRooms] : newRooms;
        hasMoreRooms = newRooms.length === PAGE_SIZE;
        pageOffset += newRooms.length;

        // Re-apply whatever filters are currently active (if any) across all rooms loaded so far.
        applyFilters();
        updateLoadMoreButton();
      } catch (error) { 
        grid.innerHTML = '<div class="col-span-full text-center text-red-400 py-10" data-i18n="errorLoading">Error loading rooms</div>';
      } finally {
        isLoadingRooms = false;
        setButtonLoading(loadMoreBtn, false);
        loadMoreBtn.textContent = t('loadMore') || 'Load More';
      }
    }

    function updateLoadMoreButton() {
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      loadMoreBtn.style.display = hasMoreRooms ? 'inline-block' : 'none';
    }
    
    function displayRooms() {
      const grid = document.getElementById('roomsGrid');
      const count = document.getElementById('resultsCount');
      
      if (!filteredRooms.length) { 
        grid.innerHTML = '<div class="col-span-full text-center text-slate-300 py-10" data-i18n="noRoomsFound">No rooms found</div>'; 
        count.innerHTML = '0 ' + t('roomsFound'); 
        return; 
      }
      
      const roomsText = filteredRooms.length === 1 ? t('roomFound') : t('roomsFound');
      count.innerHTML = `${filteredRooms.length} ${roomsText}`;
      
      grid.innerHTML = filteredRooms.map(room => `
        <div class="card">
          <img src="${room.images?.[0] || 'https://placehold.co/600x400/1e293b/22C55E?text=No+Image'}" class="w-full h-48 object-cover">
          <div class="p-4">
            <div class="mb-2">${getCardPriceDisplay(room)}</div>
            <h4 class="font-semibold text-white text-lg mt-1 truncate">${escapeHtml(room.title || 'Untitled')}</h4>
            <p class="text-slate-300 text-sm">📍 ${escapeHtml(room.city || 'Unknown')} • ${room.distance || '?'} ${t('fromUni')}</p>
            <div class="flex flex-wrap gap-1 mt-2">
              ${room.features?.slice(0,3).map(f => `<span class="feature-badge">${escapeHtml(f)}</span>`).join('') || ''}
            </div>
            <a href="details.html?id=${room.id}" class="block mt-3 text-center bg-primary text-white py-2 rounded-lg font-medium hover:bg-green-600 transition" data-i18n="viewDetails">View Details →</a>
          </div>
        </div>
      `).join('');
      
      // Apply translations to dynamic content
      updatePageLanguage();
    }
    
    function applyFilters() {
      const city = document.getElementById('selectedCityFilter').value;
      const pricingType = document.getElementById('pricingTypeFilter').value;
      let min = parseInt(document.getElementById('minPrice').value) || 0;
      let max = parseInt(document.getElementById('maxPrice').value) || Infinity;
      
      filteredRooms = allRooms.filter(room => {
        if (city && room.city !== city) return false;
        
        const roomPricing = room.pricingType || 'monthly';
        if (pricingType && roomPricing !== pricingType) return false;
        
        let roomPrice;
        if (roomPricing === 'yearly') {
          roomPrice = room.yearlyPrice || room.price || 0;
        } else if (roomPricing === 'both') {
          roomPrice = room.monthlyPrice || room.price || 0;
        } else {
          roomPrice = room.monthlyPrice || room.price || 0;
        }
        
        return roomPrice >= min && roomPrice <= max;
      });
      
      displayRooms();
      updateActiveFiltersDisplay(city, pricingType, min, max);
    }
    
    function updateActiveFiltersDisplay(city, pricingType, min, max) {
      const container = document.getElementById('activeFilters');
      const filters = [];
      
      if (city) filters.push(`<span class="bg-slate-700 px-2 py-1 rounded text-sm">📍 ${escapeHtml(city)}</span>`);
      if (pricingType) {
        let typeText = pricingType === 'monthly' ? t('monthly') : (pricingType === 'yearly' ? t('yearly') : t('both'));
        filters.push(`<span class="bg-slate-700 px-2 py-1 rounded text-sm">💰 ${typeText}</span>`);
      }
      if (min > 0) filters.push(`<span class="bg-slate-700 px-2 py-1 rounded text-sm">${t('minPriceLabel')}: ${min.toLocaleString()} FCFA</span>`);
      if (max !== Infinity) filters.push(`<span class="bg-slate-700 px-2 py-1 rounded text-sm">${t('maxPriceLabel')}: ${max.toLocaleString()} FCFA</span>`);
      
      container.innerHTML = filters.join('');
      if (filters.length === 0) container.innerHTML = '<span class="text-slate-500 text-sm">' + t('noActiveFilters') + '</span>';
    }
    
    function resetFilters() {
      document.getElementById('citySearch').value = '';
      document.getElementById('selectedCityFilter').value = '';
      document.getElementById('pricingTypeFilter').value = '';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      filteredRooms = [...allRooms];
      displayRooms();
      updateActiveFiltersDisplay('', '', 0, Infinity);
    }
    
    
    document.getElementById('applyFilters').onclick = applyFilters;
    document.getElementById('resetFilters').onclick = resetFilters;
    
    document.getElementById('minPrice').addEventListener('keypress', (e) => { if (e.key === 'Enter') applyFilters(); });
    document.getElementById('maxPrice').addEventListener('keypress', (e) => { if (e.key === 'Enter') applyFilters(); });
    document.getElementById('loadMoreBtn').addEventListener('click', () => loadRooms(true));
    
    initCityDropdown();
    loadRooms();
  </script>

  <!-- Service Worker Registration -->
