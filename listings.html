<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Rooms - StudentStay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .bg-primary { background-color: #22C55E; }
    .card { background-color: #1E293B; border-radius: 16px; overflow: hidden; border: 1px solid #334155; transition: all 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .feature-badge { background-color: #334155; color: #CBD5E1; padding: 4px 8px; border-radius: 8px; font-size: 12px; }

    body {
      background-color: #0F172A;
      color: #F1F5F9;
    }
    body .bg-slate-800 { background-color: #1E293B; border-color: #334155; }
    body .bg-slate-700 { background-color: #334155; border-color: #475569; }
    body .text-white { color: #F1F5F9; }
    body .text-slate-300 { color: #CBD5E1; }
    body .text-slate-400 { color: #94A3B8; }
    body .border-slate-700 { border-color: #334155; }
    body .card { background-color: #1E293B; border-color: #334155; }
    body .feature-badge { background-color: #334155; color: #CBD5E1; }
    body footer { background-color: #0F172A; border-color: #1E293B; }
    body footer .text-slate-400 { color: #94A3B8; }

    body.light-mode {
      background-color: #F3F4F6;
      color: #111827;
    }
    body.light-mode .bg-slate-800 { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .bg-slate-700 { background-color: #F3F4F6; border-color: #E5E7EB; }
    body.light-mode .border-slate-700 { border-color: #E5E7EB; }
    body.light-mode .card { background-color: #FFFFFF; border-color: #E5E7EB; }
    body.light-mode .card .text-white { color: #111827; }
    body.light-mode .card .text-slate-300 { color: #374151; }
    body.light-mode .card .text-slate-400 { color: #4B5563; }
    body.light-mode .feature-badge { background-color: #E5E7EB; color: #111827; }
    body.light-mode .btn-primary { background-color: #22C55E; color: white; }
    body.light-mode .btn-primary:hover { background-color: #16A34A; }
    body.light-mode .bg-primary { background-color: #22C55E; }
    body.light-mode .text-primary { color: #22C55E; }
    
    body.light-mode footer {
      background-color: #F9FAFB !important;
      border-color: #E5E7EB !important;
    }
    body.light-mode footer .text-slate-400 {
      color: #4B5563 !important;
    }

    body.light-mode select,
    body.light-mode input {
      background-color: #FFFFFF !important;
      border-color: #D1D5DB !important;
      color: #111827 !important;
    }
    body.light-mode select option {
      background-color: #FFFFFF !important;
      color: #111827 !important;
    }

    body.light-mode h1.text-white,
    body.light-mode .text-slate-300:not(nav .text-slate-300),
    body.light-mode .text-slate-400 {
      color: #111827 !important;
    }

    body.light-mode nav,
    body.light-mode .bg-slate-900\/90 {
      background-color: #0F172A !important;
    }
    body.light-mode nav .text-white,
    body.light-mode nav .text-slate-300,
    body.light-mode nav h1,
    body.light-mode nav p,
    body.light-mode nav a,
    body.light-mode nav button {
      color: #FFFFFF !important;
    }
    body.light-mode #mobileMenu {
      background-color: #1E293B !important;
    }
    body.light-mode #mobileMenu a,
    body.light-mode #mobileMenu button {
      color: #FFFFFF !important;
    }
  </style>
</head>
<body>

  <nav class="bg-slate-900/90 backdrop-blur-sm border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2"><div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center"><span class="text-white font-bold text-sm">S</span></div><div><h1 class="text-xl font-bold text-white">StudentStay</h1><p class="text-xs text-slate-300">Find Rooms. No Stress.</p></div></a>
      <div class="hidden md:flex gap-4">
        <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
        <a href="listings.html" class="text-primary text-sm">Browse</a>
        <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">List a Room</a>
        <button id="darkModeToggle" class="text-slate-300 hover:text-primary text-sm">🌓 Dark/Light</button>
        <a href="#" id="desktopLogoutBtn" class="text-slate-300 hover:text-primary text-sm">Login</a>
      </div>
      <button id="menuBtn" class="md:hidden text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    </div>
    <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 py-3 px-4 flex flex-col gap-3">
      <a href="index.html" class="text-white hover:text-primary text-sm">Home</a>
      <a href="listings.html" class="text-primary text-sm">Browse</a>
      <a href="dashboard.html" class="text-slate-300 hover:text-primary text-sm">List a Room</a>
      <button id="mobileDarkModeToggle" class="text-slate-300 hover:text-primary text-sm text-left">🌓 Dark/Light</button>
      <a href="#" id="mobileLogoutBtn" class="text-slate-300 hover:text-primary text-sm">Login</a>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-6">Browse Rooms</h1>
    <div class="bg-slate-800 rounded-xl p-4 mb-8 border border-slate-700">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <select id="cityFilter" class="bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2">
          <option value="">All Cities</option>
          <option value="Bambili">Bambili</option>
          <option value="Bamenda">Bamenda</option>
          <option value="Mankon">Mankon</option>
          <option value="Up Station">Up Station</option>
          <option value="Nkwen">Nkwen</option>
        </select>
        <input type="number" id="minPrice" placeholder="Min Price" class="bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 placeholder-slate-400">
        <input type="number" id="maxPrice" placeholder="Max Price" class="bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 placeholder-slate-400">
        <button id="applyFilters" class="bg-primary text-white rounded-lg py-2 font-semibold hover:bg-green-600">Apply Filters</button>
      </div>
    </div>
    <p id="resultsCount" class="text-slate-300 mb-4">Loading...</p>
    <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <footer class="bg-slate-900 border-t border-slate-800 py-8 text-center text-slate-400 text-sm">
    <p><span class="text-primary font-bold">StudentStay</span> — Find Rooms. No Stress.</p>
    <p class="mt-1">📍 Bambili, Bamenda, Cameroon</p>
  </footer>

  <script>
    function setDarkMode(isDark) {
      if (isDark) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      }
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') setDarkMode(false);
    else setDarkMode(true);

    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });
    document.getElementById('mobileDarkModeToggle')?.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('light-mode');
      setDarkMode(!isDark);
    });

    document.getElementById('menuBtn')?.addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));
    
    firebase.auth().onAuthStateChanged((user) => {
      const desktopBtn = document.getElementById('desktopLogoutBtn'), mobileBtn = document.getElementById('mobileLogoutBtn');
      if (user) {
        if (desktopBtn) { desktopBtn.textContent = 'Logout'; desktopBtn.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
        if (mobileBtn) { mobileBtn.textContent = 'Logout'; mobileBtn.onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); window.location.href = 'login.html'; }; }
      } else {
        if (desktopBtn) { desktopBtn.textContent = 'Login'; desktopBtn.href = 'login.html'; desktopBtn.onclick = null; }
        if (mobileBtn) { mobileBtn.textContent = 'Login'; mobileBtn.href = 'login.html'; mobileBtn.onclick = null; }
      }
    });
    
    let allRooms = [], filteredRooms = [];
    async function loadRooms() {
      const grid = document.getElementById('roomsGrid');
      grid.innerHTML = '<div class="col-span-full text-center text-slate-300 py-10">Loading rooms...</div>';
      try {
        const snapshot = await db.collection('rooms').where('status', '==', 'approved').get();
        allRooms = []; snapshot.forEach(doc => allRooms.push({ id: doc.id, ...doc.data() }));
        filteredRooms = [...allRooms]; displayRooms();
      } catch (error) { grid.innerHTML = '<div class="col-span-full text-center text-red-400 py-10">Error loading rooms</div>'; }
    }
    function displayRooms() {
      const grid = document.getElementById('roomsGrid'), count = document.getElementById('resultsCount');
      if (!filteredRooms.length) { grid.innerHTML = '<div class="col-span-full text-center text-slate-300 py-10">No rooms found</div>'; count.innerHTML = '0 rooms found'; return; }
      count.innerHTML = `${filteredRooms.length} rooms found`;
      grid.innerHTML = filteredRooms.map(room => `<div class="card"><img src="${room.images?.[0] || 'https://placehold.co/600x400/1e293b/22C55E?text=No+Image'}" class="w-full h-48 object-cover"><div class="p-4"><div class="text-green-400 font-bold text-2xl">${room.price?.toLocaleString() || 0} FCFA<span class="text-sm text-slate-300">/month</span></div><h4 class="font-semibold text-white text-lg mt-1">${room.title}</h4><p class="text-slate-300 text-sm">📍 ${room.city} • ${room.distance || '?'} km</p><div class="flex flex-wrap gap-1 mt-2">${room.features?.slice(0,3).map(f => `<span class="feature-badge">${f}</span>`).join('') || ''}</div><a href="details.html?id=${room.id}" class="block mt-3 text-center bg-primary text-white py-2 rounded-lg font-medium hover:bg-green-600">View Details →</a></div></div>`).join('');
    }
    function applyFilters() {
      const city = document.getElementById('cityFilter').value, min = parseInt(document.getElementById('minPrice').value) || 0, max = parseInt(document.getElementById('maxPrice').value) || Infinity;
      filteredRooms = allRooms.filter(r => (!city || r.city === city) && r.price >= min && r.price <= max);
      displayRooms();
    }
    document.getElementById('applyFilters').onclick = applyFilters;
    loadRooms();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    }
  </script>
</body>
</html>
